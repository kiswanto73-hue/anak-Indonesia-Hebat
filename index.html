<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anak Hebat - Disiplin Waktu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .locked { filter: grayscale(1); opacity: 0.5; pointer-events: none; background-color: #f1f5f9 !important; border-color: #e2e8f0 !important; }
        .active-now { border-color: #3b82f6 !important; ring: 2px; ring-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .dot-live { animation: pulse 1s infinite; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <div class="container mx-auto max-w-md p-4">
        <header class="bg-indigo-600 rounded-[2.5rem] p-6 shadow-xl mb-6 text-white text-center">
            <div class="flex justify-center items-center gap-2 mb-2">
                <div class="w-2 h-2 bg-red-400 rounded-full dot-live"></div>
                <p class="text-[10px] font-bold uppercase tracking-[0.2em]">Sistem Disiplin Waktu</p>
            </div>
            <h1 id="liveClock" class="text-4xl font-black mb-1">00:00:00</h1>
            <p id="liveDate" class="text-xs opacity-80 font-medium italic">Senin, 01 Januari 2024</p>
        </header>

        <div class="flex gap-4 mb-6">
            <div class="flex-1 bg-white p-4 rounded-3xl shadow-sm border text-center">
                <p class="text-[9px] font-bold text-gray-400 uppercase">Poin Kamu</p>
                <p class="text-xl font-black text-indigo-600">💎 <span id="points">0</span></p>
            </div>
            <div class="flex-1 bg-white p-4 rounded-3xl shadow-sm border text-center">
                <p class="text-[9px] font-bold text-gray-400 uppercase">Selesai</p>
                <p class="text-xl font-black text-green-600">✅ <span id="completedCount">0</span></p>
            </div>
        </div>

        <div id="missionList" class="space-y-4"></div>

        <div class="mt-8 p-5 bg-indigo-50 rounded-[2rem] border border-indigo-100">
            <h4 class="text-xs font-black text-indigo-900 mb-1 uppercase italic">Aturan Main:</h4>
            <p class="text-[10px] text-indigo-700 leading-relaxed font-medium">
                Misi hanya aktif di jam yang ditentukan. Pastikan kamu tidur maksimal jam <b>21.00</b> untuk mendapatkan poin tidur malam!
            </p>
        </div>
    </div>

    <script>
        // JADWAL KEGIATAN SESUAI PERMINTAAN
        const configMisi = [
            { id: 1, teks: "Bangun & Ibadah Pagi", ikon: "🌅", mulai: "05:00", selesai: "06:00" },
            { id: 2, teks: "Mandi & Persiapan", ikon: "🚿", mulai: "06:00", selesai: "07:00" },
            { id: 3, teks: "Belajar di Sekolah", ikon: "📚", mulai: "07:00", selesai: "13:00" },
            { id: 4, teks: "Makan & Istirahat", ikon: "💤", mulai: "13:00", selesai: "15:30" },
            { id: 5, teks: "Ibadah & Mengaji", ikon: "📖", mulai: "15:30", selesai: "17:30" },
            { id: 6, teks: "Mandi & Makan Malam", ikon: "🍱", mulai: "17:30", selesai: "19:30" },
            { id: 7, teks: "Waktu Belajar", ikon: "📝", mulai: "19:30", selesai: "20:00" },
            { id: 8, teks: "Waktu Bersama Keluarga", ikon: "👨‍👩‍👧‍👦", mulai: "20:00", selesai: "21:00" },
            { id: 9, teks: "Tidur Malam Tepat Waktu", ikon: "🌙", mulai: "21:00", selesai: "21:30" }
        ];

        let doneMissions = JSON.parse(localStorage.getItem('doneMissionsRealtime')) || [];
        let totalPoints = parseInt(localStorage.getItem('pointsAnak')) || 0;

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            document.getElementById('liveClock').innerText = timeStr;
            document.getElementById('liveDate').innerText = dateStr;

            renderMissions(timeStr.substring(0, 5));
        }

        function renderMissions(currentH) {
            const container = document.getElementById('missionList');
            container.innerHTML = '';

            configMisi.forEach(m => {
                const isCompleted = doneMissions.includes(m.id);
                const isLocked = currentH < m.mulai || currentH > m.selesai;
                const isActiveNow = currentH >= m.mulai && currentH <= m.selesai;

                container.innerHTML += `
                    <div onclick="checkMisi(${m.id}, ${isLocked}, ${isCompleted})" 
                         class="p-5 bg-white rounded-3xl border-2 transition-all flex items-center justify-between 
                         ${isCompleted ? 'bg-green-50 border-green-400' : ''} 
                         ${isLocked && !isCompleted ? 'locked' : ''} 
                         ${isActiveNow && !isCompleted ? 'active-now' : ''} shadow-sm">
                        
                        <div class="flex items-center gap-4">
                            <span class="text-3xl">${m.ikon}</span>
                            <div>
                                <p class="font-black text-slate-800 ${isCompleted ? 'line-through opacity-40' : ''}">${m.teks}</p>
                                <p class="text-[10px] font-bold ${isActiveNow ? 'text-blue-600' : 'text-gray-400'}">
                                    <i class="far fa-clock mr-1"></i> ${m.mulai} - ${m.selesai}
                                </p>
                            </div>
                        </div>

                        <div class="w-10 h-10 rounded-2xl flex items-center justify-center 
                             ${isCompleted ? 'bg-green-500 text-white shadow-lg' : 'bg-slate-100 text-transparent border border-slate-200'}">
                            <i class="fas fa-check"></i>
                        </div>
                    </div>
                `;
            });

            document.getElementById('points').innerText = totalPoints;
            document.getElementById('completedCount').innerText = doneMissions.length;
        }

        function checkMisi(id, isLocked, isCompleted) {
            if(isCompleted) return; 
            if(isLocked) {
                alert("Belum waktunya atau sudah lewat! Ingat, kunci keberhasilan adalah tepat waktu.");
                return;
            }

            doneMissions.push(id);
            totalPoints += 50; 
            
            localStorage.setItem('doneMissionsRealtime', JSON.stringify(doneMissions));
            localStorage.setItem('pointsAnak', totalPoints);
            
            updateTime();
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
