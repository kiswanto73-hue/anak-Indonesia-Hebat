<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anak Indonesia Hebat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .locked { filter: grayscale(1); opacity: 0.5; pointer-events: none; }
        .active-now { border-color: #3b82f6 !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">
    <div id="mainApp" class="container mx-auto max-w-md p-4">
        <header class="bg-indigo-600 rounded-[2.5rem] p-6 shadow-xl mb-6 text-white text-center">
            <h2 class="text-[10px] font-bold uppercase tracking-[0.2em] mb-1 opacity-80">Halo, <span id="displayChildName">Siswa</span>!</h2>
            <h1 id="liveClock" class="text-4xl font-black mb-1">00:00:00</h1>
            <p id="liveDate" class="text-xs opacity-70 italic"></p>
        </header>
        <div class="flex gap-4 mb-6">
            <div class="flex-1 bg-white p-4 rounded-3xl shadow-sm border text-center">
                <p class="text-[9px] font-bold text-gray-400 uppercase">Poin Kamu</p>
                <p class="text-xl font-black text-indigo-600">💎 <span id="points">0</span></p>
            </div>
            <div class="flex-1 bg-white p-4 rounded-3xl shadow-sm border text-center">
                <p class="text-[9px] font-bold text-gray-400 uppercase">Selesai</p>
                <p class="text-xl font-black text-green-600">✅ <span id="completedCount">0</span></p>
            </div>
        </div>
        <div id="missionList" class="space-y-4"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA0_GBPJRz3yQQiEb9a5PkGLgrfBBHPloA",
            authDomain: "ceklist-anak-indonesia-hebat.firebaseapp.com",
            databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.firebaseio.com",
            projectId: "ceklist-anak-indonesia-hebat",
            storageBucket: "ceklist-anak-indonesia-hebat.firebasestorage.app",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const configMisi = [
            { id: 1, teks: "Bangun & Ibadah Pagi", ikon: "🌅", mulai: "05:00", selesai: "06:00" },
            { id: 2, teks: "Mandi Pagi & Rapi", ikon: "🚿", mulai: "06:00", selesai: "07:00" },
            { id: 3, teks: "Belajar di Sekolah", ikon: "📚", mulai: "07:00", selesai: "13:00" },
            { id: 4, teks: "Makan & Istirahat", ikon: "💤", mulai: "13:00", selesai: "15:30" },
            { id: 5, teks: "Ibadah & Mengaji", ikon: "📖", mulai: "15:30", selesai: "17:30" },
            { id: 6, teks: "Mandi & Makan Malam", ikon: "🍱", mulai: "17:30", selesai: "19:30" },
            { id: 7, teks: "Waktu Belajar", ikon: "📝", mulai: "19:30", selesai: "20:00" },
            { id: 8, teks: "Waktu Keluarga", ikon: "👨‍👩‍👧‍👦", mulai: "20:00", selesai: "21:00" },
            { id: 9, teks: "Tidur Tepat Waktu", ikon: "🌙", mulai: "21:00", selesai: "21:30" }
        ];

        let childName = localStorage.getItem('childName') || prompt("Siapa namamu?");
        if(childName) localStorage.setItem('childName', childName);
        document.getElementById('displayChildName').innerText = childName;

        let points = parseInt(localStorage.getItem('pointsAnak')) || 0;
        let doneToday = JSON.parse(localStorage.getItem('doneToday')) || [];

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour12: false, hour:'2-digit', minute:'2-digit', second:'2-digit'});
            document.getElementById('liveDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('liveClock').innerText = timeStr;
            render(timeStr.substring(0, 5));
        }

        function render(currentH) {
            const container = document.getElementById('missionList');
            container.innerHTML = '';
            configMisi.forEach(m => {
                const isDone = doneToday.includes(m.id);
                const isActive = currentH >= m.mulai && currentH <= m.selesai;
                const isLocked = !isDone && (currentH < m.mulai || currentH > m.selesai);
                
                container.innerHTML += `
                    <div onclick="checkMisi(${m.id}, ${isLocked}, ${isDone})" class="p-5 bg-white rounded-3xl border-2 flex items-center justify-between ${isDone ? 'border-green-400 bg-green-50' : ''} ${isLocked ? 'locked' : ''} ${isActive && !isDone ? 'active-now' : ''} shadow-sm cursor-pointer">
                        <div class="flex items-center gap-4">
                            <span class="text-3xl">${m.ikon}</span>
                            <div><p class="font-bold text-slate-800">${m.teks}</p><p class="text-[9px] text-gray-400 font-bold">${m.mulai} - ${m.selesai}</p></div>
                        </div>
                        <div class="w-10 h-10 rounded-2xl flex items-center justify-center ${isDone ? 'bg-green-500 text-white' : 'bg-slate-100 text-transparent border'}"><i class="fas fa-check"></i></div>
                    </div>`;
            });
            document.getElementById('points').innerText = points;
            document.getElementById('completedCount').innerText = doneToday.length;
        }

        function checkMisi(id, isLocked, isDone) {
            if(isDone || isLocked) return;
            doneToday.push(id);
            points += 50;
            localStorage.setItem('doneToday', JSON.stringify(doneToday));
            localStorage.setItem('pointsAnak', points);

            database.ref('rekap_siswa/' + childName.replace(/\s/g, '_')).set({
                nama: childName,
                total_poin: points,
                misi_terakhir: configMisi.find(m => m.id === id).teks,
                waktu_update: new Date().toLocaleString()
            });
            updateTime();
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
