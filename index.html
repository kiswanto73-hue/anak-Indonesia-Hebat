<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">

    <div class="max-w-4xl mx-auto p-6">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-black text-yellow-400 italic">PAPAN PERINGKAT HERO</h1>
            <p class="text-slate-400 text-sm uppercase tracking-widest mt-2">Update Real-time dari Database</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-slate-900 rounded-[2rem] p-6 border border-white/10">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-emerald-400">🏆 Top XP Hero</h2>
                <div id="papanXP" class="space-y-3">
                    <p class="text-xs opacity-50">Memuat data petualangan...</p>
                </div>
            </div>

            <div class="bg-slate-900 rounded-[2rem] p-6 border border-white/10">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-indigo-400">📚 Aktivitas Terakhir</h2>
                <div id="papanLama" class="space-y-3">
                    <p class="text-xs opacity-50">Memuat data sirkulasi lama...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config);
        const db = firebase.database();

        // 1. MENGAMBIL DATA BARU (Dari folder hero_leaderboard)
        db.ref('hero_leaderboard').orderByChild('total_xp').limitToLast(10).on('value', snap => {
            const container = document.getElementById('papanXP');
            container.innerHTML = "";
            let list = [];
            snap.forEach(s => { list.push(s.val()); });
            list.reverse().forEach((h, i) => {
                container.innerHTML += `
                    <div class="flex justify-between bg-white/5 p-3 rounded-xl border border-white/5">
                        <span class="text-xs font-bold uppercase">${i+1}. ${h.nama} <span class="text-[9px] opacity-50">(${h.kelas})</span></span>
                        <span class="text-emerald-400 font-black">${h.total_xp} XP</span>
                    </div>`;
            });
        });

        // 2. MENGAMBIL DATA LAMA (Dari folder perpus_laporan atau rekap_siswa)
        // Kita cek di 'perpus_laporan' (asumsi data lama sirkulasi di sini)
        db.ref('perpus_laporan').limitToLast(10).on('value', snap => {
            const container = document.getElementById('papanLama');
            container.innerHTML = "";
            let list = [];
            snap.forEach(s => { list.push(s.val()); });
            list.reverse().forEach(h => {
                container.innerHTML += `
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                        <p class="text-[10px] font-bold text-indigo-300 uppercase">${h.namaSiswa || h.nama}</p>
                        <p class="text-[9px] opacity-70 italic">${h.judulBuku || h.misi || 'Aktivitas Umum'}</p>
                        <p class="text-[7px] opacity-30 mt-1">${h.tglPinjam || h.waktu || ''}</p>
                    </div>`;
            });
        });
    </script>
</body>
</html>
