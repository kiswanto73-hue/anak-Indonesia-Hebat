<!DOCTYPE html>
<html>
<head>
    <title>Tes Koneksi Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
</head>
<body>
    <h2>Tes Kirim Data</h2>
    <input type="text" id="nama" placeholder="Ketik Nama Anda">
    <button id="btnKirim" onclick="kirim()">KLIK UNTUK TES</button>
    <p id="status"></p>

    <script>
        // PASTIKAN LINK DI BAWAH INI SAMA DENGAN DI LAYAR FIREBASE BAPAK
        const firebaseConfig = {
            databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function kirim() {
            const nama = document.getElementById('nama').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btnKirim');

            if(!nama) return alert("Isi nama dulu Pak!");

            status.innerText = "Sedang mencoba mengirim...";
            btn.disabled = true;

            // Mencoba menulis ke database
            db.ref('tes_koneksi').set({
                nama_pengirim: nama,
                waktu: new Date().toLocaleString()
            }).then(() => {
                status.innerText = "ALHAMDULILLAH BERHASIL! Cek layar Firebase Bapak sekarang.";
                btn.disabled = false;
            }).catch((err) => {
                status.innerText = "GAGAL! Error: " + err.message;
                btn.disabled = false;
                console.error(err);
            });
        }
    </script>
</body>
</html>
