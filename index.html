<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Peringkat Hero - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-4 font-sans">
    <div class="max-w-xl mx-auto py-10">
        <h1 class="text-center text-4xl font-black italic text-yellow-400 uppercase tracking-tighter mb-10">Ranking Pahlawan 🏆</h1>
        
        <div class="bg-slate-900/80 rounded-[2.5rem] border border-white/10 overflow-hidden shadow-2xl">
            <div id="papanSkor" class="p-6 space-y-4">
                <p class="text-center text-xs opacity-50 animate-pulse uppercase">Menghubungkan ke folder rekap_siswa...</p>
            </div>
        </div>

        <div class="mt-8 grid grid-cols-2 gap-4">
            <a href="rekap-petualangan.html" class="bg-yellow-400 text-slate-900 p-4 rounded-2xl text-center font-black uppercase text-xs italic">Hero Tracker 🦸‍♂️</a>
            <a href="menu-perpus.html" class="bg-indigo-600 p-4 rounded-2xl text-center font-black uppercase text-xs italic">Perpustakaan 📚</a>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.database();

        db.ref('rekap_siswa').on('value', snap => {
            const container = document.getElementById('papanSkor');
            container.innerHTML = "";
            let list = [];
            
            snap.forEach(s => { 
                const d = s.val();
                list.push({ nama: d.nama, kls: d.kelas, xp: parseInt(d.xp) || 0 });
            });

            list.sort((a, b) => b.xp - a.xp);

            list.forEach((h, i) => {
                const color = i < 3 ? 'text-yellow-400' : 'text-slate-400';
                container.innerHTML += `
                    <div class="flex justify-between items-center p-4 bg-white/5 rounded-2xl border border-white/5">
                        <div class="flex items-center gap-4">
                            <span class="font-black ${color}">#${i+1}</span>
                            <div>
                                <p class="text-xs font-black uppercase tracking-tight">${h.nama}</p>
                                <p class="text-[8px] font-bold opacity-40 uppercase">${h.kls}</p>
                            </div>
                        </div>
                        <span class="text-sm font-black text-emerald-400">${h.xp} XP</span>
                    </div>`;
            });
        });
    </script>
</body>
</html>
