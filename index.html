<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Tracker - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-2 md:p-4 font-sans text-slate-800">

    <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden border-b-[12px] border-indigo-600 relative">
        
        <div class="bg-indigo-700 p-6 text-center text-white cursor-pointer select-none" onclick="cekModeGuru()">
            <p id="gelarHero" class="text-[10px] font-black tracking-[0.3em] text-yellow-400 mb-1 uppercase italic">Memuat Petualangan...</p>
            <h1 id="displayNama" class="text-2xl font-black italic tracking-tighter uppercase leading-none">Petualangan Hero</h1>
            <div id="lvlBadge" class="mt-2 bg-white/20 rounded-full py-1 px-4 inline-block border border-white/30 text-[10px] font-bold uppercase">Leveling...</div>
        </div>

        <div id="progressPanel" class="hidden px-6 pt-4 text-center">
            <div class="flex justify-between text-[10px] font-black text-indigo-900 mb-1 uppercase">
                <span>Poin Level Ini</span>
                <span id="valPoin">0 / 2000 XP</span>
            </div>
            <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden p-[2px]">
                <div id="barPoin" class="bg-indigo-600 h-full rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <div id="tabNav" class="hidden space-y-3 px-6 mt-6">
            <button onclick="bukaLeaderboard()" class="w-full py-3 bg-yellow-400 text-indigo-900 rounded-2xl font-black text-[10px] uppercase shadow-lg flex items-center justify-center gap-2 hover:scale-[1.02] transition-transform">
                🏆 Lihat Peringkat Hero
            </button>
            <div class="flex gap-2">
                <button id="btnHero" onclick="pindahMenu('hero')" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-indigo-600 text-white shadow-md">🛡️ Hero Tracker</button>
                <button id="btnSatset" onclick="pindahMenu('satset')" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-slate-100 text-slate-400">🌙 Satset Ramadhan</button>
            </div>
        </div>

        <div id="formNama" class="hidden p-8 space-y-4">
            <input type="text" id="inputNama" placeholder="NAMA LENGKAP..." class="w-full bg-slate-100 p-5 rounded-2xl text-center font-black text-indigo-700 border-2 border-transparent focus:border-indigo-500 outline-none uppercase">
            <select id="inputKelas" class="w-full bg-slate-100 p-5 rounded-2xl font-black text-indigo-700 text-center uppercase appearance-none">
                <option value="">-- PILIH KELAS --</option>
                <option value="Kelas 1">KELAS 1</option><option value="Kelas 2">KELAS 2</option>
                <option value="Kelas 3">KELAS 3</option><option value="Kelas 4">KELAS 4</option>
                <option value="Kelas 5">KELAS 5</option><option value="Kelas 6">KELAS 6</option>
            </select>
            <button onclick="simpanProfil()" class="w-full bg-indigo-600 text-white font-black p-5 rounded-2xl shadow-xl uppercase italic hover:bg-indigo-700 transition-all">Mulai Petualangan 🚀</button>
        </div>

        <div id="formMisi" class="hidden p-6 pt-4">
            <div id="divHero" class="space-y-3">
                <div id="listMisi" class="space-y-3"></div>
                <div id="boxSertifikat" class="hidden mt-6 p-5 bg-yellow-400 rounded-[2rem] text-center shadow-xl border-4 border-white animate-bounce">
                    <button onclick="cetakSertifikat()" class="w-full bg-indigo-700 text-white font-black py-4 rounded-2xl uppercase italic text-[11px]">📜 Ambil Piagam Level</button>
                </div>
            </div>

            <div id="divSatset" class="hidden space-y-3">
                <div class="bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-100 mb-2 text-center">
                    <p class="text-[10px] font-black text-emerald-700 uppercase italic leading-none">🌙 SATSET RAMADHAN</p>
                    <p id="infoHari" class="text-[7px] font-bold text-emerald-600 uppercase tracking-widest mt-1">Memuat hari...</p>
                </div>
                <div id="listSatset" class="space-y-3 max-h-[400px] overflow-y-auto pr-2"></div>
            </div>

            <div id="panelGuru" class="hidden mt-8 p-6 bg-slate-800 rounded-[2.5rem] border-2 border-indigo-400 space-y-4">
                <p class="text-[10px] font-black text-indigo-400 uppercase text-center tracking-widest">🔐 Panel Monitoring Guru</p>
                <a href="admin.html" class="block w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-xs text-center">📊 Buka Dashboard Kontrol</a>
            </div>

            <button onclick="logout()" class="w-full mt-10 text-[9px] font-black text-slate-300 uppercase italic underline text-center block">Ganti Identitas Hero</button>
        </div>

        <div id="modalLeaderboard" class="fixed inset-0 z-[500] bg-indigo-950/95 hidden overflow-y-auto p-6 backdrop-blur-md">
            <div class="max-w-sm mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-white font-black italic uppercase text-xl text-yellow-400">🏆 Top 10 Hero</h2>
                    <button onclick="tutupLeaderboard()" class="text-white text-3xl font-bold">&times;</button>
                </div>
                <div id="isiLeaderboard" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.database();

        const daftarMisi = [
            { label: "🌞 Bangun & Ibadah Subuh", limit: "05:30", poin: 50 },
            { label: "🧹 Bantu Orang Tua / Beres Rumah", limit: "06:30", poin: 40 },
            { label: "🎒 Siap Sekolah (Mandiri)", limit: "07:00", poin: 30 },
            { label: "📖 Belajar / Mengaji Malam", limit: "20:30", poin: 40 },
            { label: "💤 Tidur Cepat (Maks 21:30)", limit: "21:30", poin: 50 }
        ];

        const dataSatset = [
            { h: 1, m: "Menyiapkan sajadah Ortu" }, { h: 2, m: "Menghafal doa buka puasa" }, { h: 3, m: "Menaruh piring kotor ke dapur" },
            { h: 4, m: "Merapikan tempat tidur" }, { h: 5, m: "Memijat bahu Mama/Papa" }, { h: 6, m: "Memberi senyum dan salam" },
            { h: 7, m: "Sabar dan tidak marah" }, { h: 8, m: "Subuh tepat waktu" }, { h: 9, m: "Baca 5 ayat Al-Quran" },
            { h: 10, m: "Sedekah uang jajan" }, { h: 11, m: "Ikut Sholat Tarawih" }, { h: 12, m: "Hafal 1 surat pendek" },
            { h: 13, m: "Doakan Bapak Ibu Guru" }, { h: 14, m: "Mendengar cerita Nabi" }, { h: 15, m: "Berbagi takjil" },
            { h: 16, m: "Buang sampah orang lain" }, { h: 17, m: "Sopan bertemu tetangga" }, { h: 18, m: "Meminjamkan mainan" },
            { h: 19, m: "Hemat air dan listrik" }, { h: 20, m: "Surat cinta buat Ortu" }, { h: 21, m: "Berkata jujur seharian" },
            { h: 22, m: "Siapkan baju koko/mukena" }, { h: 23, m: "Menyiram tanaman" }, { h: 24, m: "Baca buku 15 menit" },
            { h: 25, m: "Membantu masak buka" }, { h: 26, m: "Menyusun alas kaki" }, { h: 27, m: "Mengajak teman sholat" },
            { h: 28, m: "Belajar 1 Asmaul Husna" }, { h: 29, m: "Bersihkan debu meja" }, { h: 30, m: "Meminta maaf & peluk Ortu" }
        ];

        let hNama = localStorage.getItem('heroNama');
        let hKelas = localStorage.getItem('heroKelas');
        let clickHeader = 0;

        window.onload = () => {
            if (hNama && hKelas) { sinkronData(); } 
            else { document.getElementById('formNama').classList.remove('hidden'); }
        };

        function sinkronData() {
            const path = hNama.replace(/\s+/g, '_');
            db.ref('rekap_siswa/' + path).on('value', snap => {
                const data = snap.val();
                if (data) {
                    updateTampilan(parseInt(data.xp) || 0);
                    renderMisiHero(data.misi_harian || {});
                } else {
                    db.ref('rekap_siswa/' + path).set({ nama: hNama, kelas: hKelas, xp: 0, waktu: new Date().toLocaleString('id-ID') });
                }
            });
        }

        function updateTampilan(xp) {
            document.getElementById('formNama').classList.add('hidden');
            document.getElementById('formMisi').classList.remove('hidden');
            document.getElementById('progressPanel').classList.remove('hidden');
            document.getElementById('tabNav').classList.remove('hidden');
            window.currentXP = xp;
            const level = Math.floor(xp / 2000) + 1;
            const xpSisa = xp % 2000;
            document.getElementById('displayNama').innerText = hNama;
            document.getElementById('gelarHero').innerText = "Hero " + hKelas;
            document.getElementById('lvlBadge').innerText = "Level " + level;
            document.getElementById('valPoin').innerText = xpSisa + " / 2000 XP";
            document.getElementById('barPoin').style.width = (xpSisa / 2000 * 100) + "%";
            if (xp >= 2000) document.getElementById('boxSertifikat').classList.remove('hidden');
        }

        function renderMisiHero(dataTercentang) {
            const tglHariIni = new Date().toLocaleDateString('id-ID');
            document.getElementById('listMisi').innerHTML = daftarMisi.map((m, idx) => {
                const isDone = dataTercentang['misi_' + idx] === tglHariIni;
                return `
                    <div class="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex justify-between items-center">
                        <div><p class="font-black text-slate-700 text-[11px] uppercase italic">${m.label}</p>
                        <p class="text-[8px] font-bold text-red-500 italic mt-1 uppercase">Batas: ${m.limit}</p></div>
                        <input type="checkbox" ${isDone ? 'checked disabled' : ''} onchange="prosesMisi(this, ${m.poin}, '${m.limit}', ${idx})" class="w-8 h-8 accent-indigo-600 cursor-pointer">
                    </div>`;
            }).join('');
        }

        function prosesMisi(el, poin, limitStr, idxMisi) {
            if(!el.checked) return;
            const path = hNama.replace(/\s+/g, '_');
            const now = new Date(); const [h, m] = limitStr.split(':').map(Number);
            const limit = new Date(); limit.setHours(h, m, 0);
            let pDapat = (now <= limit) ? poin : -poin;
            if(now > limit) alert("Terlambat! Poin dikurangi.");
            else confetti({particleCount: 40});
            let baru = Math.max(0, (window.currentXP || 0) + pDapat);
            db.ref('rekap_siswa/' + path).update({ xp: baru, ['misi_harian/misi_' + idxMisi]: now.toLocaleDateString('id-ID') });
        }

        // PERBAIKAN TOTAL FUNGSI SATSET
        function muatSatset() {
            const path = hNama.replace(/\s+/g, '_');
            const tglMulai = new Date("2026-02-19"); 
            const tglSekarang = new Date();
            const hariKe = Math.floor((tglSekarang - tglMulai) / (1000 * 60 * 60 * 24)) + 1;
            const hariAktif = Math.max(1, hariKe);

            document.getElementById('infoHari').innerText = "HARI INI: HARI KE-" + hariAktif;

            db.ref('rekap_siswa/' + path + '/ramadhan').on('value', snap => {
                const data = snap.val() || {};
                document.getElementById('listSatset').innerHTML = dataSatset.map(item => {
                    const isDone = data['h' + item.h] ? true : false;
                    const isToday = item.h === hariAktif;
                    const isLocked = item.h > hariAktif;

                    return `
                        <div class="p-4 rounded-3xl border-2 transition-all ${isToday ? 'bg-emerald-50 border-emerald-400' : 'bg-white border-slate-50'}">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[9px] font-black ${isToday ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-400'} w-8 h-8 flex items-center justify-center rounded-full">H${item.h}</span>
                                <p class="flex-1 ml-3 text-[10px] font-black text-slate-700 uppercase">${item.m}</p>
                                ${isDone ? '✅' : (isLocked ? '🔒' : (isToday ? '⭐' : '❌'))}
                            </div>
                            ${isToday && !isDone ? `
                                <div class="mt-3">
                                    <label class="block w-full py-2 bg-white border-2 border-dashed border-emerald-300 rounded-xl text-center text-[8px] font-bold text-emerald-600 cursor-pointer">
                                        📸 UPLOAD FOTO BUKTI
                                        <input type="file" accept="image/*" class="hidden" onchange="prosesSatset(${item.h}, this)">
                                    </label>
                                </div>` : ''}
                        </div>`;
                }).join('');
            });
        }

        function prosesSatset(hari, el) {
            const file = el.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                const path = hNama.replace(/\s+/g, '_');
                db.ref('rekap_siswa/' + path + '/ramadhan').update({ 
                    ['h' + hari]: true, ['foto_h' + hari]: reader.result, tgl: new Date().toLocaleString('id-ID') 
                }).then(() => {
                    db.ref('rekap_siswa/' + path).update({ xp: (window.currentXP || 0) + 100 });
                    confetti({particleCount: 100});
                });
            };
        }

        function pindahMenu(menu) {
            document.getElementById('divHero').classList.toggle('hidden', menu !== 'hero');
            document.getElementById('divSatset').classList.toggle('hidden', menu === 'hero');
            document.getElementById('btnHero').className = menu === 'hero' ? 'flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-indigo-600 text-white shadow-md' : 'flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-slate-100 text-slate-400';
            document.getElementById('btnSatset').className = menu === 'satset' ? 'flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-indigo-600 text-white shadow-md' : 'flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-slate-100 text-slate-400';
            if(menu === 'satset') muatSatset();
        }

        function bukaLeaderboard() {
            document.getElementById('modalLeaderboard').classList.remove('hidden');
            const list = document.getElementById('isiLeaderboard');
            list.innerHTML = `<p class="text-white text-center animate-pulse py-10">MENGAMBIL DATA HERO...</p>`;

            db.ref('rekap_siswa').once('value', snap => {
                let dataArray = [];
                snap.forEach(child => {
                    const s = child.val();
                    if(s.nama) dataArray.push(s);
                });
                dataArray.sort((a, b) => (b.xp || 0) - (a.xp || 0));
                const top10 = dataArray.slice(0, 10);
                list.innerHTML = top10.map((s, i) => `
                    <div class="flex justify-between items-center bg-white/10 p-4 rounded-2xl border border-white/5">
                        <div class="flex items-center gap-3">
                            <span class="text-xl font-black ${i<3 ? 'text-yellow-400' : 'text-indigo-400'}">#${i+1}</span>
                            <div>
                                <p class="text-white font-black text-[10px] uppercase">${s.nama}</p>
                                <p class="text-[7px] text-white/50 font-bold uppercase">${s.kelas}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-yellow-400 font-black text-sm">${(s.xp || 0).toLocaleString()}</p>
                            <p class="text-[6px] text-white/30 font-bold uppercase">XP</p>
                        </div>
                    </div>`).join('');
            });
        }

        function tutupLeaderboard() { document.getElementById('modalLeaderboard').classList.add('hidden'); }
        function simpanProfil() {
            const n = document.getElementById('inputNama').value.trim().toUpperCase();
            const k = document.getElementById('inputKelas').value;
            if(n.length < 3 || !k) return alert("Lengkapi data!");
            localStorage.setItem('heroNama', n); localStorage.setItem('heroKelas', k);
            location.reload();
        }
        function cekModeGuru() { clickHeader++; if(clickHeader >= 5) { document.getElementById('panelGuru').classList.toggle('hidden'); clickHeader=0; } }
        function logout() { if(confirm("Ganti Hero?")) { localStorage.clear(); location.reload(); } }
        function cetakSertifikat() { alert("Fitur piagam segera hadir!"); }
    </script>
</body>
</html>
