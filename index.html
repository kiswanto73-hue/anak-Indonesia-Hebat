<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Tracker - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-indigo-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden border-b-[12px] border-yellow-400">
        
        <div class="bg-indigo-700 p-6 text-center text-white">
            <h1 class="text-2xl font-black italic">PETUALANGAN HERO</h1>
            <div id="statusHero" class="mt-2 bg-indigo-800 rounded-full py-1 px-4 inline-block border border-indigo-500 text-[10px] font-bold uppercase">
                🔴 Belum Masuk
            </div>
        </div>

        <div id="progressPanel" class="hidden px-6 pt-4">
            <div class="flex justify-between text-[10px] font-black text-indigo-900 mb-1">
                <span id="labelWelcome">TARGET PIAGAM</span>
                <span id="valPoin">0 / 2000 XP</span>
            </div>
            <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden border-2 border-white shadow-sm">
                <div id="barPoin" class="bg-yellow-400 h-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <div id="formNama" class="p-8">
            <input type="text" id="inputNama" placeholder="KETIK NAMA DISINI..." class="w-full bg-slate-100 p-5 rounded-2xl text-center font-black text-indigo-700 border-2 border-transparent focus:border-yellow-400 outline-none mb-4 uppercase">
            <button onclick="simpanProfil()" class="w-full bg-yellow-400 text-indigo-900 font-black p-5 rounded-2xl shadow-[0_6px_0_0_#ca8a04] active:shadow-none active:translate-y-1 transition-all uppercase italic">Masuk 🚀</button>
        </div>

        <div id="formMisi" class="hidden p-6">
            <div class="bg-green-100 p-3 rounded-xl mb-4 text-center">
                <p class="text-[10px] font-bold text-green-700 uppercase">⚡ Mode Realtime Aktif</p>
            </div>
            
            <div class="space-y-3">
                <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex items-center justify-between" 
                     data-limit="05:30" data-poin="50" data-label="IBADAH SUBUH">
                    <div class="flex items-center">
                        <input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600">
                        <div>
                            <p class="font-black text-slate-700 text-xs uppercase">🌞 IBADAH SUBUH</p>
                            <p class="text-[9px] font-bold text-red-500 italic">BATAS: 05.30</p>
                        </div>
                    </div>
                </div>

                <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex items-center justify-between" 
                     data-limit="06:30" data-poin="40" data-label="BERSIH KASUR & ORTU">
                    <div class="flex items-center">
                        <input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600">
                        <div>
                            <p class="font-black text-slate-700 text-xs uppercase">🧹 BERSIH KASUR & ORTU</p>
                            <p class="text-[9px] font-bold text-red-500 italic">BATAS: 06.30</p>
                        </div>
                    </div>
                </div>

                <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex items-center justify-between" 
                     data-limit="07:00" data-poin="30" data-label="SIAP SEKOLAH">
                    <div class="flex items-center">
                        <input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600">
                        <div>
                            <p class="font-black text-slate-700 text-xs uppercase">🎒 SIAP SEKOLAH</p>
                            <p class="text-[9px] font-bold text-red-500 italic">BATAS: 07.00</p>
                        </div>
                    </div>
                </div>

                <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex items-center justify-between" 
                     data-limit="20:30" data-poin="50" data-label="BELAJAR DIRUMAH">
                    <div class="flex items-center">
                        <input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600">
                        <div>
                            <p class="font-black text-slate-700 text-xs uppercase">📖 BELAJAR DIRUMAH</p>
                            <p class="text-[9px] font-bold text-red-500 italic">BATAS: 20.30</p>
                        </div>
                    </div>
                </div>

                <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex items-center justify-between" 
                     data-limit="21:00" data-poin="30" data-label="TIDUR CEPAT">
                    <div class="flex items-center">
                        <input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600">
                        <div>
                            <p class="font-black text-slate-700 text-xs uppercase">💤 TIDUR CEPAT</p>
                            <p class="text-[9px] font-bold text-red-500 italic">BATAS: 21.00</p>
                        </div>
                    </div>
                </div>
            </div>

            <button id="btnPiagam" onclick="cetakPiagam()" class="hidden w-full bg-indigo-600 text-white font-black p-4 rounded-2xl mt-8 border-4 border-yellow-400 shadow-xl italic animate-bounce">📜 CETAK PIAGAM HERO</button>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let heroNama = localStorage.getItem('heroNama') || "";
        let tabunganPoin = parseInt(localStorage.getItem('heroXP')) || 0;

        window.onload = function() {
            if(heroNama) {
                tampilkanMisi();
                document.getElementById('labelWelcome').innerText = "WELCOME BACK, " + heroNama;
            }
        };

        function simpanProfil() {
            const val = document.getElementById('inputNama').value.trim();
            if(val.length < 3) return alert("Masukkan Nama!");
            heroNama = val.toUpperCase();
            localStorage.setItem('heroNama', heroNama);
            tampilkanMisi();
        }

        function tampilkanMisi() {
            document.getElementById('formNama').classList.add('hidden');
            document.getElementById('formMisi').classList.remove('hidden');
            document.getElementById('progressPanel').classList.remove('hidden');
            document.getElementById('statusHero').innerText = "🟢 HERO: " + heroNama;
            updateUIProgress();
        }

        function updateUIProgress() {
            document.getElementById('valPoin').innerText = `${tabunganPoin} / 2000 XP`;
            let persen = (tabunganPoin / 2000) * 100;
            document.getElementById('barPoin').style.width = Math.min(persen, 100) + "%";
            if(tabunganPoin >= 2000) {
                document.getElementById('btnPiagam').classList.remove('hidden');
                sebarKembangApi();
            }
        }

        function kirimOtomatis(el) {
            const box = el.closest('.misi-item');
            const limit = box.dataset.limit;
            const poinMisi = parseInt(box.dataset.poin);
            const label = box.dataset.label;

            const now = new Date();
            const jam = now.getHours().toString().padStart(2, '0');
            const menit = now.getMinutes().toString().padStart(2, '0');
            const waktuSekarang = `${jam}:${menit}`;

            let poinDidapat = 0;
            let statusLog = "";

            if (el.checked) {
                if (waktuSekarang <= limit) {
                    poinDidapat = poinMisi;
                    statusLog = "SUKSES";
                    el.disabled = true;
                } else {
                    poinDidapat = -poinMisi;
                    statusLog = "TERLAMBAT";
                    alert("Waduh, jam sudah lewat! Poin berkurang.");
                }

                tabunganPoin += poinDidapat;
                if(tabunganPoin < 0) tabunganPoin = 0;
                localStorage.setItem('heroXP', tabunganPoin);
                updateUIProgress();

                // PENGIRIMAN DATA (Sesuai Struktur Guru)
                db.ref('rekap_siswa/' + heroNama.replace(/\s+/g, '_')).set({
                    nama: heroNama,
                    misi: label + " -> " + statusLog,
                    poin_harian: poinDidapat,
                    total_xp: tabunganPoin,
                    waktu: now.toLocaleString('id-ID')
                });
            }
        }

        function sebarKembangApi() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }

        function cetakPiagam() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            doc.setFillColor(30, 27, 75); doc.rect(0, 0, 297, 210, 'F');
            doc.setDrawColor(250, 204, 21); doc.setLineWidth(10); doc.rect(10, 10, 277, 190);
            doc.setTextColor(250, 204, 21); doc.setFontSize(40); doc.text("PIAGAM HERO INDONESIA", 148, 60, {align: "center"});
            doc.setTextColor(255, 255, 255); doc.setFontSize(30); doc.text(heroNama, 148, 110, {align: "center"});
            doc.setFontSize(16); doc.text("Berhasil mengumpulkan 2000 XP!", 148, 150, {align: "center"});
            doc.save(`Piagam_${heroNama}.pdf`);
        }
    </script>
</body>
</html>
