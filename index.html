<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anak Indonesia Hebat - Siswa</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-50 min-h-screen p-4">

    <div id="setup" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl mt-10 border-t-8 border-indigo-600">
        <h2 class="text-2xl font-bold mb-2 text-center text-indigo-700">Selamat Datang!</h2>
        <p class="text-center text-gray-500 mb-6 text-sm">Silakan masukkan nama lengkapmu</p>
        <input type="text" id="namaSiswa" placeholder="Nama Lengkap..." class="w-full border-2 border-indigo-100 p-4 rounded-xl mb-4 focus:outline-none focus:border-indigo-500 transition-all text-center font-semibold uppercase">
        <button onclick="mulai()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-xl font-bold shadow-lg transition-all active:scale-95">MULAI AKTIVITAS</button>
    </div>

    <div id="mainApp" class="hidden max-w-md mx-auto bg-white p-6 rounded-3xl shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <h2 id="displayNama" class="text-lg font-bold text-indigo-700 italic"></h2>
            <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold uppercase">Misi Hari Ini</span>
        </div>

        <div id="misiList" class="space-y-3">
            <label class="flex items-center p-4 border-2 border-gray-50 rounded-2xl cursor-pointer hover:bg-indigo-50 transition-all">
                <input type="checkbox" class="misi-item w-6 h-6 mr-4 accent-indigo-600" value="Ibadah & Mengaji" data-poin="20">
                <span class="text-gray-700 font-medium">Ibadah & Mengaji (+20)</span>
            </label>
            <label class="flex items-center p-4 border-2 border-gray-50 rounded-2xl cursor-pointer hover:bg-indigo-50 transition-all">
                <input type="checkbox" class="misi-item w-6 h-6 mr-4 accent-indigo-600" value="Makan & Istirahat" data-poin="10">
                <span class="text-gray-700 font-medium">Makan & Istirahat (+10)</span>
            </label>
            <label class="flex items-center p-4 border-2 border-gray-50 rounded-2xl cursor-pointer hover:bg-indigo-50 transition-all">
                <input type="checkbox" class="misi-item w-6 h-6 mr-4 accent-indigo-600" value="Belajar Mandiri" data-poin="15">
                <span class="text-gray-700 font-medium">Belajar Mandiri (+15)</span>
            </label>
            <label class="flex items-center p-4 border-2 border-gray-50 rounded-2xl cursor-pointer hover:bg-indigo-50 transition-all">
                <input type="checkbox" class="misi-item w-6 h-6 mr-4 accent-indigo-600" value="Membantu Orang Tua" data-poin="15">
                <span class="text-gray-700 font-medium">Membantu Orang Tua (+15)</span>
            </label>
            <label class="flex items-center p-4 border-2 border-gray-50 rounded-2xl cursor-pointer hover:bg-indigo-50 transition-all">
                <input type="checkbox" class="misi-item w-6 h-6 mr-4 accent-indigo-600" value="Olahraga / Gerak Fisik" data-poin="10">
                <span class="text-gray-700 font-medium">Olahraga / Gerak (+10)</span>
            </label>
        </div>

        <button id="btnSimpan" onclick="kirimData()" class="w-full bg-green-500 hover:bg-green-600 text-white p-5 rounded-2xl font-black mt-8 shadow-xl transition-all active:scale-95 flex justify-center items-center gap-2">
            🚀 SIMPAN LAPORAN SEKARANG
        </button>
        <p class="text-center text-gray-400 text-[10px] mt-4 italic text-xs font-semibold uppercase">Klik tombol di atas untuk mengirim ke Guru</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA0_GBPJRz3yQQiEb9a5PkGLgrfBBHPloA",
            authDomain: "ceklist-anak-indonesia-hebat.firebaseapp.com",
            databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.firebaseio.com",
            projectId: "ceklist-anak-indonesia-hebat",
            storageBucket: "ceklist-anak-indonesia-hebat.firebasestorage.app",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let namaSiswa = "";

        function mulai() {
            const input = document.getElementById('namaSiswa');
            namaSiswa = input.value.trim();
            if (namaSiswa.length > 2) {
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('displayNama').innerText = "Hi, " + namaSiswa;
            } else {
                alert("Mohon masukkan nama lengkapmu ya!");
            }
        }

        function kirimData() {
            const btn = document.getElementById('btnSimpan');
            const misiDiceklis = document.querySelectorAll('.misi-item:checked');
            let totalPoin = 0;
            let daftarMisi = [];

            misiDiceklis.forEach(item => {
                totalPoin += parseInt(item.getAttribute('data-poin'));
                daftarMisi.push(item.value);
            });

            if (daftarMisi.length === 0) {
                alert("Centang dulu aktivitas yang sudah kamu lakukan!");
                return;
            }

            // Ganti teks tombol saat mengirim
            btn.innerText = "SEDANG MENGIRIM...";
            btn.disabled = true;

            const slugNama = namaSiswa.replace(/\s+/g, '_');
            
            database.ref('rekap_siswa/' + slugNama).set({
                nama: namaSiswa,
                total_poin: totalPoin,
                misi_terakhir: daftarMisi.join(", "),
                waktu_update: new Date().toLocaleTimeString('id-ID') + " WIB"
            }).then(() => {
                alert("Hebat! Laporan " + namaSiswa + " sudah terkirim!");
                location.reload(); 
            }).catch((error) => {
                alert("Gagal kirim: " + error.message);
                btn.innerText = "🚀 SIMPAN LAPORAN SEKARANG";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
