<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Anak Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 p-4">
    <div id="setup" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md mt-10">
        <h2 class="text-xl font-bold mb-4 text-center text-blue-600">Daftar Nama Siswa</h2>
        <input type="text" id="namaSiswa" placeholder="Masukkan Nama Lengkap" class="w-full border p-3 rounded-lg mb-4">
        <button onclick="mulai()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold">MULAI</button>
    </div>

    <div id="mainApp" class="hidden max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <h2 id="displayNama" class="text-lg font-bold mb-4 text-blue-700 italic"></h2>
        <div id="misiList" class="space-y-3">
            <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-green-50">
                <input type="checkbox" class="misi-item w-5 h-5 mr-3" value="Ibadah & Mengaji" data-poin="10">
                <span>Ibadah & Mengaji (10 Poin)</span>
            </label>
            <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-green-50">
                <input type="checkbox" class="misi-item w-5 h-5 mr-3" value="Membantu Orang Tua" data-poin="10">
                <span>Membantu Orang Tua (10 Poin)</span>
            </label>
            <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-green-50">
                <input type="checkbox" class="misi-item w-5 h-5 mr-3" value="Belajar & Tugas" data-poin="10">
                <span>Belajar & Tugas (10 Poin)</span>
            </label>
        </div>
        <button onclick="kirimData()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold mt-6 shadow-lg">SIMPAN LAPORAN</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA0_GBPJRz3yQQiEb9a5PkGLgrfBBHPloA",
            authDomain: "ceklist-anak-indonesia-hebat.firebaseapp.com",
            databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.firebaseio.com",
            projectId: "ceklist-anak-indonesia-hebat",
            storageBucket: "ceklist-anak-indonesia-hebat.firebasestorage.app",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let namaSiswa = "";

        function mulai() {
            namaSiswa = document.getElementById('namaSiswa').value;
            if (namaSiswa) {
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('displayNama').innerText = "Halo, " + namaSiswa;
            } else {
                alert("Masukkan nama dulu ya!");
            }
        }

        function kirimData() {
            const misiDiceklis = document.querySelectorAll('.misi-item:checked');
            let totalPoin = 0;
            let daftarMisi = [];

            misiDiceklis.forEach(item => {
                totalPoin += parseInt(item.getAttribute('data-poin'));
                daftarMisi.push(item.value);
            });

            if (daftarMisi.length === 0) {
                alert("Centang minimal satu kegiatan dulu, Pak!");
                return;
            }

            database.ref('rekap_siswa/' + namaSiswa.replace(/\s+/g, '_')).set({
                nama: namaSiswa,
                total_poin: totalPoin,
                misi_terakhir: daftarMisi.join(", "),
                waktu_update: new Date().toLocaleString('id-ID')
            }).then(() => {
                alert("Laporan Berhasil Terkirim ke Guru!");
                location.reload(); // Reset setelah kirim
            });
        }
    </script>
</body>
</html>
