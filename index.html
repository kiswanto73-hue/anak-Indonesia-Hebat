<!DOCTYPE html>
<html>
<head>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <h1>TES DARURAT</h1>
    <button onclick="kirim()">KLIK INI</button>
    <p id="hasil">Status: Siap</p>

    <script>
        // Gunakan alamat database langsung tanpa konfigurasi ribet
        var config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        
        function kirim() {
            document.getElementById('hasil').innerText = "⏳ SEDANG MEMAKSA MASUK...";
            
            // Mencoba menulis ke folder 'TES'
            firebase.database().ref('TES').set({
                pesan: "Bismillah Berhasil",
                waktu: new Date().toLocaleTimeString()
            }, function(error) {
                if (error) {
                    document.getElementById('hasil').innerText = "❌ GAGAL: " + error.message;
                } else {
                    document.getElementById('hasil').innerText = "✅ BERHASIL! CEK FIREBASE!";
                }
            });
        }
    </script>
</body>
</html>
