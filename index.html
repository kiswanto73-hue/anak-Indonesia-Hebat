<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Tracker - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-indigo-900 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden border-b-[12px] border-yellow-400">
        
        <div class="bg-indigo-700 p-6 text-center text-white">
            <h1 class="text-2xl font-black italic">MISI HERO HARIAN</h1>
            <div id="userInfo" class="hidden mt-2 bg-indigo-800 rounded-full py-1 px-4 inline-block border border-indigo-500">
                <span id="displayNama" class="text-xs font-bold uppercase tracking-wider"></span>
            </div>
        </div>

        <div id="progressPanel" class="hidden px-6 pt-4">
            <div class="flex justify-between text-[10px] font-black text-indigo-900 mb-1">
                <span>PROGRESS PIAGAM</span>
                <span id="valPoin">0 / 2000 XP</span>
            </div>
            <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden border-2 border-white shadow-sm">
                <div id="barPoin" class="bg-yellow-400 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div id="formNama" class="p-8">
            <input type="text" id="inputNama" placeholder="NAMA HERO-MU..." class="w-full bg-slate-100 p-5 rounded-2xl text-center font-black text-indigo-700 border-2 border-transparent focus:border-yellow-400 outline-none mb-4 uppercase shadow-inner">
            <button onclick="mulai()" class="w-full bg-yellow-400 text-indigo-900 font-black p-5 rounded-2xl shadow-[0_6px_0_0_#ca8a04] active:shadow-none active:translate-y-1 transition-all uppercase tracking-widest">Mulai Misi 🚀</button>
        </div>

        <div id="formMisi" class="hidden p-6">
            <div class="space-y-3" id="listMisi">
                <div class="misi-box bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex items-center justify-between group transition-all" data-limit="07:00">
                    <div class="flex items-center">
                        <input type="checkbox" class="misi-check w-6 h-6 mr-3 accent-indigo-600" data-poin="50">
                        <div>
                            <p class="font-black text-slate-700 text-sm">🕌 IBADAH SUBUH</p>
                            <p class="text-[9px] font-bold text-red-500 italic">BATAS: 07.00 WIB</p>
                        </div>
                    </div>
                    <span class="text-[10px] font-black text-green-600">+50 XP</span>
                </div>

                <div class="misi-box bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex items-center justify-between group transition-all" data-limit="08:00">
                    <div class="flex items-center">
                        <input type="checkbox" class="misi-check w-6 h-6 mr-3 accent-indigo-600" data-poin="30">
                        <div>
                            <p class="font-black text-slate-700 text-sm">🧹 BERSIH KAMAR</p>
                            <p class="text-[9px] font-bold text-red-500 italic">BATAS: 08.00 WIB</p>
                        </div>
                    </div>
                    <span class="text-[10px] font-black text-green-600">+30 XP</span>
                </div>

                <div class="misi-box bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex items-center justify-between group transition-all" data-limit="15:00">
                    <div class="flex items-center">
                        <input type="checkbox" class="misi-check w-6 h-6 mr-3 accent-indigo-600" data-poin="40">
                        <div>
                            <p class="font-black text-slate-700 text-sm">📚 BELAJAR MANDIRI</p>
                            <p class="text-[9px] font-bold text-red-500 italic">BATAS: 15.00 WIB</p>
                        </div>
                    </div>
                    <span class="text-[10px] font-black text-green-600">+40 XP</span>
                </div>
            </div>

            <button id="btnKirim" onclick="prosesLaporan()" class="w-full bg-green-500 hover:bg-green-600 text-white font-black p-5 rounded-2xl mt-8 shadow-[0_6px_0_0_#16a34a] active:shadow-none active:translate-y-1 transition-all uppercase italic">KIRIM LAPORAN 📡</button>
            
            <button id="btnPiagam" onclick="cetakPiagam()" class="hidden w-full bg-indigo-600 text-white font-black p-4 rounded-2xl mt-4 animate-bounce border-4 border-yellow-400 shadow-xl italic">📜 CETAK PIAGAM HERO</button>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let heroNama = "";
        let tabunganPoin = parseInt(localStorage.getItem('tabunganPoin')) || 0;

        function updateUIProgress() {
            document.getElementById('valPoin').innerText = `${tabunganPoin} / 2000 XP`;
            let persen = (tabunganPoin / 2000) * 100;
            document.getElementById('barPoin').style.width = Math.min(persen, 100) + "%";
            if(tabunganPoin >= 2000) document.getElementById('btnPiagam').classList.remove('hidden');
        }

        function mulai() {
            const val = document.getElementById('inputNama').value.trim();
            if(val.length < 3) return alert("Masukkan Nama!");
            heroNama = val.toUpperCase();
            document.getElementById('formNama').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('progressPanel').classList.remove('hidden');
            document.getElementById('formMisi').classList.remove('hidden');
            document.getElementById('displayNama').innerText = "HERO: " + heroNama;
            updateUIProgress();
        }

        function prosesLaporan() {
            const now = new Date();
            const currentTime = now.getHours() + ":" + (now.getMinutes()<10?'0':'') + now.getMinutes();
            let perolehanHariIni = 0;
            let detailMisi = [];

            document.querySelectorAll('.misi-box').forEach(box => {
                const check = box.querySelector('.misi-check');
                const limit = box.getAttribute('data-limit');
                const poinMisi = parseInt(check.getAttribute('data-poin'));
                const labelMisi = box.querySelector('p').innerText;

                // LOGIKA: Jika Terlewat Jam Batas ATAU Tidak Dicentang = MINUS
                if (currentTime > limit || !check.checked) {
                    perolehanHariIni -= poinMisi; // Otomatis Poin Berkurang
                    detailMisi.push(labelMisi + " (GAGAL/TELAT)");
                } else {
                    perolehanHariIni += poinMisi;
                    detailMisi.push(labelMisi + " (SUKSES)");
                }
            });

            tabunganPoin += perolehanHariIni;
            if(tabunganPoin < 0) tabunganPoin = 0; // Poin tidak boleh minus di tabungan
            localStorage.setItem('tabunganPoin', tabunganPoin);

            // Kirim ke Guru
            db.ref('rekap_siswa/' + heroNama.replace(/\s+/g, '_')).set({
                nama: heroNama,
                misi: detailMisi.join(", "),
                poin_harian: perolehanHariIni,
                total_xp: tabunganPoin,
                waktu: now.toLocaleString('id-ID')
            }).then(() => {
                alert(`Laporan Terkirim!\nPerolehan Hari Ini: ${perolehanHariIni} XP\nTotal XP Sekarang: ${tabunganPoin}`);
                location.reload();
            });
        }

        function cetakPiagam() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            
            doc.setFillColor(63, 81, 181);
            doc.rect(0, 0, 297, 210, 'F');
            doc.setDrawColor(255, 215, 0);
            doc.setLineWidth(5);
            doc.rect(10, 10, 277, 190);
            
            doc.setTextColor(255, 215, 0);
            doc.setFontSize(40);
            doc.text("PIAGAM PENGHARGAAN", 148, 60, {align: "center"});
            
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(20);
            doc.text("Diberikan Kepada Hero Terbaik:", 148, 90, {align: "center"});
            
            doc.setFontSize(35);
            doc.setFont("helvetica", "bold");
            doc.text(heroNama, 148, 120, {align: "center"});
            
            doc.setFontSize(18);
            doc.setFont("helvetica", "normal");
            doc.text("Atas Keberhasilan Mengumpulkan 2000 XP dalam", 148, 150, {align: "center"});
            doc.text("PETUALANGAN ANAK INDONESIA HEBAT", 148, 160, {align: "center"});
            
            doc.save(`Piagam_${heroNama}.pdf`);
        }
    </script>
</body>
</html>
