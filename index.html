<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Tracker - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden border-b-[12px] border-indigo-600">
        
        <div class="bg-indigo-700 p-6 text-center text-white cursor-pointer" onclick="cekModeGuru()">
            <p id="gelarHero" class="text-[10px] font-black tracking-[0.3em] text-yellow-400 mb-1 uppercase italic">Memuat Gelar...</p>
            <h1 id="displayNama" class="text-2xl font-black italic tracking-tighter uppercase leading-none">Petualangan Hero</h1>
            <div id="lvlBadge" class="mt-2 bg-white/20 rounded-full py-1 px-4 inline-block border border-white/30 text-[10px] font-bold uppercase">Leveling...</div>
        </div>

        <div id="progressPanel" class="hidden px-6 pt-4 text-center">
            <div class="flex justify-between text-[10px] font-black text-indigo-900 mb-1 uppercase">
                <span>Poin Level Ini</span>
                <span id="valPoin">0 / 2000 XP</span>
            </div>
            <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden p-[2px]">
                <div id="barPoin" class="bg-indigo-600 h-full rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <div id="tabNav" class="hidden flex px-6 gap-2 mt-6">
            <button id="btnHero" onclick="pindahMenu('hero')" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-indigo-600 text-white shadow-lg">🛡️ Hero Tracker</button>
            <button id="btnSatset" onclick="pindahMenu('satset')" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-slate-100 text-slate-400">🌙 Satset Ramadhan</button>
        </div>

        <div id="formNama" class="hidden p-8 space-y-4">
            <input type="text" id="inputNama" placeholder="NAMA LENGKAP..." class="w-full bg-slate-100 p-5 rounded-2xl text-center font-black text-indigo-700 border-2 border-transparent focus:border-indigo-500 outline-none uppercase">
            <select id="inputKelas" class="w-full bg-slate-100 p-5 rounded-2xl font-black text-indigo-700 text-center uppercase">
                <option value="">-- PILIH KELAS --</option>
                <option value="Kelas 1">KELAS 1</option><option value="Kelas 2">KELAS 2</option>
                <option value="Kelas 3">KELAS 3</option><option value="Kelas 4">KELAS 4</option>
                <option value="Kelas 5">KELAS 5</option><option value="Kelas 6">KELAS 6</option>
            </select>
            <button onclick="simpanProfil()" class="w-full bg-indigo-600 text-white font-black p-5 rounded-2xl shadow-xl uppercase italic hover:bg-indigo-700 transition-all">Mulai Petualangan 🚀</button>
        </div>

        <div id="formMisi" class="hidden p-6 pt-4 space-y-3">
            
            <div id="divHero" class="space-y-3">
                <div id="listMisi" class="space-y-3"></div>
                <div id="boxSertifikat" class="hidden mt-6 p-5 bg-yellow-400 rounded-[2rem] text-center shadow-xl animate-bounce border-4 border-white">
                    <button onclick="cetakSertifikat()" class="w-full bg-indigo-700 text-white font-black py-4 rounded-2xl uppercase italic text-[11px]">📜 Ambil Piagam Level</button>
                </div>
            </div>

            <div id="divSatset" class="hidden space-y-3">
                <div class="bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-100 mb-2">
                    <p class="text-[9px] font-black text-emerald-700 uppercase italic text-center leading-tight">Satu Hari Satu Etika Baik (SATSET)<br>Tantangan 30 Hari Kebaikan</p>
                </div>
                <div id="listSatset" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                    </div>
            </div>

            <button onclick="logout()" class="w-full mt-6 text-[9px] font-black text-slate-300 hover:text-red-400 uppercase italic underline text-center">Ganti Identitas Hero</button>
        </div>

        <div id="panelGuru" class="hidden bg-red-50 p-6 border-y-2 border-red-200 space-y-3">
            <p class="text-[10px] font-black text-red-600 uppercase text-center">🔐 ADMIN KISWANTO</p>
            <input type="number" id="newXP" class="w-full p-3 rounded-xl border-2 border-red-300 font-black text-center" placeholder="SET XP BARU">
            <button onclick="updateXPManual()" class="w-full bg-red-600 text-white py-3 rounded-xl font-black uppercase text-xs">Simpan XP</button>
        </div>
    </div>

    <script>
        // CONFIG FIREBASE
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.database();

        // DATA MISI HARIAN (HERO)
        const daftarMisi = [
            { label: "🌞 Bangun & Ibadah", limit: "05:30", poin: 50 },
            { label: "🧹 Bantu Orang Tua", limit: "06:30", poin: 40 },
            { label: "🎒 Siap Sekolah", limit: "07:00", poin: 30 },
            { label: "📖 Belajar Malam", limit: "20:00", poin: 40 },
            { label: "💤 Tidur Cepat", limit: "21:30", poin: 50 }
        ];

        // DATA MISI SATSET (RAMADHAN)
        const dataSatset = [
            { h: 1, m: "Menyiapkan sajadah Papa dan Mama" }, { h: 2, m: "Menghafal doa buka puasa" }, { h: 3, m: "Menaruh piring kotor ke dapur" },
            { h: 4, m: "Merapikan tempat tidur sendiri" }, { h: 5, m: "Memijat bahu Mama/Papa" }, { h: 6, m: "Memberi senyum dan salam" },
            { h: 7, m: "Sabar dan tidak marah-marah" }, { h: 8, m: "Sholat Subuh tepat waktu" }, { h: 9, m: "Membaca 5 ayat Al-Quran atau Iqra" },
            { h: 10, m: "Sedekah uang jajan ke masjid" }, { h: 11, m: "Ikut Sholat Tarawih Berjamaah" }, { h: 12, m: "Menghafal 1 surat pendek baru" },
            { h: 13, m: "Mendoakan Bapak dan Ibu Guru" }, { h: 14, m: "Mendengar cerita Nabi" }, { h: 15, m: "Berbagi takjil ke tetangga" },
            { h: 16, m: "Membuang sampah di jalan/masjid" }, { h: 17, m: "Sopan bertemu orang di jalan" }, { h: 18, m: "Meminjamkan mainan ke teman" },
            { h: 19, m: "Mematikan keran air mengalir" }, { h: 20, m: "Menulis surat cinta buat Ortu" }, { h: 21, m: "Berkata jujur seharian" },
            { h: 22, m: "Menyiapkan baju sholat sendiri" }, { h: 23, m: "Menyiram tanaman rumah" }, { h: 24, m: "Membaca buku (kurangi HP)" },
            { h: 25, m: "Memberi sedekah/takjil" }, { h: 26, m: "Membantu siapkan hidangan buka" }, { h: 27, m: "Mengajak teman berbuat baik" },
            { h: 28, m: "Belajar 1 Asmaul Husna" }, { h: 29, m: "Merapikan rak sepatu" }, { h: 30, m: "Meminta maaf & memeluk Ortu" }
        ];

        let hNama = localStorage.getItem('heroNama');
        let hKelas = localStorage.getItem('heroKelas');
        let clickHeader = 0;

        window.onload = () => {
            if (hNama && hKelas) {
                document.getElementById('tabNav').classList.remove('hidden');
                renderMisiHero();
                sinkronData();
            } else {
                document.getElementById('formNama').classList.remove('hidden');
            }
        };

        function pindahMenu(menu) {
            const isHero = menu === 'hero';
            document.getElementById('divHero').classList.toggle('hidden', !isHero);
            document.getElementById('divSatset').classList.toggle('hidden', isHero);
            document.getElementById('btnHero').className = isHero ? "flex-1 py-3 rounded-2xl font-black text-[10px] uppercase bg-indigo-600 text-white shadow-lg" : "flex-1 py-3 rounded-2xl font-black text-[10px] uppercase bg-slate-100 text-slate-400";
            document.getElementById('btnSatset').className = !isHero ? "flex-1 py-3 rounded-2xl font-black text-[10px] uppercase bg-emerald-600 text-white shadow-lg" : "flex-1 py-3 rounded-2xl font-black text-[10px] uppercase bg-slate-100 text-slate-400";
            if(!isHero) muatSatset();
        }

        function renderMisiHero() {
            document.getElementById('listMisi').innerHTML = daftarMisi.map(m => `
                <div class="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex justify-between items-center">
                    <div><p class="font-black text-slate-700 text-[11px] uppercase">${m.label}</p>
                    <p class="text-[8px] font-bold text-red-500 opacity-70 italic uppercase">Batas: ${m.limit}</p></div>
                    <input type="checkbox" onchange="prosesMisi(this, ${m.poin}, '${m.limit}')" class="w-7 h-7 accent-indigo-600">
                </div>
            `).join('');
        }

        function muatSatset() {
            const list = document.getElementById('listSatset');
            const path = hNama.replace(/\s+/g, '_');
            db.ref('rekap_siswa/' + path + '/ramadhan').once('value', snap => {
                const data = snap.val() || {};
                list.innerHTML = dataSatset.map(item => `
                    <div class="bg-white border-2 border-slate-50 p-4 rounded-2xl flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-3">
                            <span class="text-[9px] font-black text-emerald-500 bg-emerald-50 w-7 h-7 flex items-center justify-center rounded-full border border-emerald-100">H${item.h}</span>
                            <p class="text-[10px] font-bold text-slate-700 uppercase leading-tight">${item.m}</p>
                        </div>
                        <input type="checkbox" ${data['h'+item.h] ? 'checked disabled' : ''} onchange="simpanSatset(${item.h}, this)" class="w-6 h-6 accent-emerald-600">
                    </div>
                `).join('');
            });
        }

        function simpanSatset(hari, el) {
            if(!el.checked) return;
            const path = hNama.replace(/\s+/g, '_');
            db.ref('rekap_siswa/' + path + '/ramadhan').update({
                ['h'+hari]: true,
                tgl: new Date().toLocaleString('id-ID')
            });
            el.disabled = true;
            confetti({particleCount: 40, spread: 70, colors: ['#10b981', '#fbbf24']});
        }

        function sinkronData() {
            const path = hNama.replace(/\s+/g, '_');
            db.ref('rekap_siswa/' + path).on('value', snap => {
                let xpVal = 0;
                if(snap.exists()) xpVal = parseInt(snap.val().xp) || 0;
                updateTampilan(xpVal);
            });
        }

        function updateTampilan(xp) {
            document.getElementById('formNama').classList.add('hidden');
            document.getElementById('formMisi').classList.remove('hidden');
            document.getElementById('progressPanel').classList.remove('hidden');
            document.getElementById('tabNav').classList.remove('hidden');
            window.currentXP = xp;
            const level = Math.floor(xp / 2000) + 1;
            const xpSisa = xp % 2000;
            const gelarArr = ["Calon Pahlawan", "Pahlawan Muda", "Pahlawan Sejati", "Pahlawan Agung", "Legenda Hebat"];
            document.getElementById('displayNama').innerText = hNama;
            document.getElementById('gelarHero').innerText = gelarArr[Math.min(level-1, 4)] + " (" + hKelas + ")";
            document.getElementById('lvlBadge').innerText = "Level " + level;
            document.getElementById('valPoin').innerText = xpSisa + " / 2000 XP";
            document.getElementById('barPoin').style.width = (xpSisa / 2000 * 100) + "%";
            if (xp >= 2000) document.getElementById('boxSertifikat').classList.remove('hidden');
            else document.getElementById('boxSertifikat').classList.add('hidden');
        }

        function prosesMisi(el, poin, limitStr) {
            if(!el.checked) return;
            const [h, m] = limitStr.split(':').map(Number);
            const now = new Date(); const limit = new Date(); limit.setHours(h, m, 0);
            let pDapat = (now <= limit) ? poin : -poin;
            if(now > limit) alert("Kamu terlambat! Poin dikurangi.");
            else { confetti({particleCount: 50, spread: 60}); el.disabled = true; }
            let baru = (window.currentXP || 0) + pDapat;
            if(baru < 0) baru = 0;
            const path = hNama.replace(/\s+/g, '_');
            db.ref('rekap_siswa/' + path).update({ nama: hNama, kelas: hKelas, xp: baru, waktu: now.toLocaleString('id-ID') });
        }

        function simpanProfil() {
            const n = document.getElementById('inputNama').value.trim().toUpperCase();
            const k = document.getElementById('inputKelas').value;
            if(n.length < 3 || !k) return alert("Pilih Nama & Kelas!");
            localStorage.setItem('heroNama', n); localStorage.setItem('heroKelas', k);
            location.reload();
        }

        function cekModeGuru() { clickHeader++; if(clickHeader >= 5) { document.getElementById('panelGuru').classList.toggle('hidden'); clickHeader = 0; } }
        
        function updateXPManual() { 
            const v = document.getElementById('newXP').value; 
            if(v!=="") { db.ref('rekap_siswa/' + hNama.replace(/\s+/g, '_')).update({ xp: parseInt(v) }); alert("XP Berhasil Diperbarui!"); }
        }

        function logout() { if(confirm("Ganti Akun?")) { localStorage.clear(); location.reload(); } }

        function cetakSertifikat() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            const xp = window.currentXP;
            const lvl = Math.floor(xp / 2000);
            doc.setFontSize(30); doc.text("PIAGAM HERO", 148, 80, {align:"center"});
            doc.setFontSize(20); doc.text(hNama, 148, 110, {align:"center"});
            doc.save(`Piagam_${hNama}.pdf`);
        }
    </script>
</body>
</html>
