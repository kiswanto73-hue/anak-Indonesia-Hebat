<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Pahlawan & Perpus - Admin Kiswanto</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen p-4 font-sans text-slate-200">

    <div id="loginOverlay" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-[3rem] shadow-2xl max-w-sm w-full text-center border-b-8 border-orange-600">
            <span class="text-5xl">👨‍✈️</span>
            <h2 class="text-xl font-black uppercase italic mt-4 text-slate-800">Admin Login</h2>
            <p class="text-[10px] font-bold text-slate-400 tracking-widest uppercase mb-6">Khusus Pak Kiswanto</p>
            
            <input type="email" id="adminEmail" placeholder="EMAIL ADMIN" class="w-full text-center text-sm font-bold p-4 bg-slate-100 rounded-2xl mb-2 outline-none border-2 border-transparent focus:border-orange-500 text-slate-800">
            
            <input type="password" id="adminPass" placeholder="MASUKKAN PASSWORD" class="w-full text-center text-xl font-black p-4 bg-slate-100 rounded-2xl mb-4 outline-none border-2 border-transparent focus:border-orange-500 text-slate-800">
            
            <button onclick="loginAdmin()" class="w-full bg-orange-600 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-orange-700 transition-all uppercase italic text-xs">Masuk Sistem 🔓</button>
        </div>
    </div>

    <div id="adminContent" class="max-w-4xl mx-auto hidden">
        
        <div class="bg-orange-600 p-6 rounded-[2.5rem] shadow-xl mb-6 border-b-8 border-orange-800 flex justify-between items-center text-white">
            <div>
                <p class="text-[9px] font-black uppercase tracking-widest opacity-80 italic">OTP Katalog Perpus Aktif:</p>
                <h2 id="monitorOTP" class="text-5xl font-black tracking-[0.2em] my-2">----</h2>
                <p id="waktuOTP" class="text-[9px] opacity-70 font-bold uppercase tracking-widest italic tracking-tighter">Memantau Data...</p>
            </div>
            <div class="text-right">
                <span id="statusOTP" class="bg-white/20 px-4 py-2 rounded-full text-[10px] font-black uppercase italic tracking-widest">AKTIF</span>
                <button onclick="location.reload()" class="block mt-4 text-[8px] font-black underline opacity-50 hover:opacity-100 uppercase italic">Keluar Sesi</button>
            </div>
        </div>

        <div class="bg-indigo-900 p-6 rounded-t-[2rem] shadow-2xl border-b-4 border-yellow-500">
            <h1 class="text-2xl font-black italic tracking-tighter uppercase text-yellow-400">🕵️ CCTV & LOG AUDIT</h1>
            <p class="text-[10px] font-bold text-indigo-300 uppercase tracking-[0.2em]">Memantau Kejujuran & Perubahan Sistem</p>
        </div>

        <div class="bg-white rounded-b-[2rem] overflow-hidden shadow-xl border-x-2 border-b-2 border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-[10px] font-black uppercase tracking-widest">
                            <th class="p-4 border-b">Waktu</th>
                            <th class="p-4 border-b">Pelaku/Siswa</th>
                            <th class="p-4 border-b">Aksi / XP Baru</th>
                            <th class="p-4 border-b">Status</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody" class="text-slate-800 text-xs font-medium"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CONFIG DATABASE TETAP SAMA
        const config = { 
            databaseURL: "https://e-perpus-a652c-default-rtdb.asia-southeast1.firebasedatabase.app" 
        };
        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.database();

        // KREDENSIAL TETAP SESUAI PERMINTAAN BAPAK
        const emailBenar = "sdn169.cintadamai@gmail.com";
        const passBenar = "Cintadama1";

        function loginAdmin() {
            const inputEmail = document.getElementById('adminEmail').value;
            const inputPass = document.getElementById('adminPass').value;

            if (inputEmail === emailBenar && inputPass === passBenar) {
                alert("Akses Diterima, Pak Kiswanto!");
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                jalankanMonitor();
            } else {
                alert("Email atau Password Salah! Perhatikan huruf besar-kecilnya, Pak.");
            }
        }

        function jalankanMonitor() {
            // Pantau Kode OTP di Database
            db.ref('sistem_keamanan/otp_katalog').on('value', snap => {
                if(snap.exists()) {
                    const data = snap.val();
                    document.getElementById('monitorOTP').innerText = data.kode;
                    document.getElementById('waktuOTP').innerText = "Update Terakhir: " + data.waktu;
                }
            });

            // Pantau Audit Log
            db.ref('audit_log').limitToLast(50).on('value', snap => {
                const body = document.getElementById('logTableBody');
                body.innerHTML = "";
                if(!snap.exists()){
                    body.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-400 italic font-bold uppercase text-[10px]">Belum ada aktivitas baru...</td></tr>`;
                    return;
                }
                snap.forEach(item => {
                    const log = item.val();
                    body.innerHTML = `
                        <tr class="border-b border-slate-50 hover:bg-yellow-50 transition-colors italic">
                            <td class="p-4 text-[10px] text-slate-400 font-mono">${log.waktu || '-'}</td>
                            <td class="p-4 font-black text-indigo-700 uppercase">${log.nama_pengubah || '-'}</td>
                            <td class="p-4 font-bold text-red-600">SET XP: ${log.xp_baru || '-'}</td>
                            <td class="p-4">
                                <span class="bg-red-100 text-red-700 text-[8px] px-2 py-1 rounded-full font-black uppercase">
                                    ${log.status || 'MODIFIKASI'}
                                </span>
                            </td>
                        </tr>` + body.innerHTML;
                });
            });
        }
    </script>
</body>
</html>
