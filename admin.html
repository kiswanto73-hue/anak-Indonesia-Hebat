<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Admin - Kiswanto</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; }
        }
        .loading-shimmer { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-950 min-h-screen p-2 font-sans text-slate-200 pb-20">

    <div id="loginOverlay" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-[3rem] shadow-2xl max-w-sm w-full text-center border-b-8 border-orange-600">
            <span class="text-5xl">👨‍✈️</span>
            <h2 class="text-xl font-black uppercase italic mt-4 text-slate-800">Admin Login</h2>
            <input type="email" id="adminEmail" placeholder="EMAIL ADMIN" class="w-full text-center text-sm font-bold p-4 bg-slate-100 rounded-2xl my-4 text-slate-800 outline-none">
            <input type="password" id="adminPass" placeholder="PASSWORD" class="w-full text-center text-xl font-black p-4 bg-slate-100 rounded-2xl mb-4 text-slate-800 outline-none">
            <button onclick="loginAdmin()" class="w-full bg-orange-600 text-white font-black py-4 rounded-2xl uppercase italic text-xs shadow-lg">Masuk Sistem 🔓</button>
        </div>
    </div>

    <div id="adminContent" class="max-w-4xl mx-auto hidden pb-20">
        <div class="bg-orange-600 p-6 rounded-[2.5rem] shadow-xl mb-6 flex justify-between items-center text-white no-print">
            <div>
                <p class="text-[9px] font-black uppercase opacity-80 italic">OTP Katalog Perpus:</p>
                <h2 id="monitorOTP" class="text-5xl font-black tracking-[0.2em] my-2">----</h2>
            </div>
            <button onclick="location.reload()" class="bg-white/20 px-4 py-2 rounded-full text-[10px] font-black uppercase italic">Keluar</button>
        </div>

        <div class="bg-indigo-900/50 p-6 rounded-[2rem] shadow-2xl mb-6 border-2 border-indigo-400/30 no-print">
            <h2 class="text-yellow-400 font-black italic uppercase text-sm mb-4">🚀 Bonus XP Masal</h2>
            <div class="flex gap-2">
                <input type="number" id="massXPValue" placeholder="Jumlah" class="w-24 bg-slate-800 p-4 rounded-2xl text-white font-black outline-none border border-indigo-500">
                <button onclick="prosesXPSelection()" class="flex-1 bg-emerald-600 text-white font-black rounded-2xl text-[10px] uppercase italic">➕ Tambah Ke Semua</button>
            </div>
        </div>

        <div class="bg-indigo-600 p-4 rounded-t-[2rem] flex justify-between items-center no-print">
            <h1 class="text-sm font-black italic uppercase text-white px-2">📊 Kontrol Poin</h1>
            <button onclick="tarikSemuaData()" class="bg-white/20 text-white text-[9px] px-3 py-1 rounded-full font-bold">🔄 SEGARKAN</button>
        </div>
        <div class="bg-white mb-8 rounded-b-[2rem] overflow-hidden shadow-xl border-x-2 border-b-2 border-slate-200 no-print">
            <table class="w-full text-left border-collapse text-slate-800 text-[11px]">
                <tbody id="tabelHeroBody"></tbody>
            </table>
        </div>

        <div class="bg-emerald-600 p-4 rounded-t-[2rem] flex flex-wrap justify-between items-center gap-2">
            <h1 class="text-sm font-black italic uppercase text-white px-2">🌙 Monitor Satset Ramadhan</h1>
            <div class="flex items-center gap-2 no-print">
                <button onclick="window.print()" class="bg-white/20 text-white text-[10px] font-black px-3 py-1.5 rounded-lg uppercase italic">🖨️ Cetak</button>
                <select id="pilihHariAdmin" onchange="tarikSemuaData()" class="bg-white text-emerald-700 text-[10px] font-black rounded-lg px-2 py-1 outline-none">
                    </select>
            </div>
        </div>
        <div class="bg-white mb-8 rounded-b-[2rem] overflow-hidden shadow-xl border-x-2 border-b-2 border-slate-200">
            <table class="w-full text-left border-collapse text-slate-800 text-[11px]">
                <thead>
                    <tr class="bg-slate-50 text-slate-400 text-[8px] font-black uppercase">
                        <th class="p-4 border-b">Nama Siswa</th>
                        <th class="p-4 border-b text-center">Progres</th>
                        <th class="p-4 border-b text-center text-orange-600">Bukti Foto</th>
                        <th class="p-4 border-b text-center no-print">Detail</th>
                    </tr>
                </thead>
                <tbody id="tabelRamadhanBody">
                    <tr><td colspan="4" class="p-10 text-center text-slate-400 italic">Sedang menyambungkan ke database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modalFoto" class="fixed inset-0 bg-black/95 hidden z-[500] flex items-center justify-center p-4" onclick="this.classList.add('hidden')">
        <img id="imgPreview" src="" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl border-4 border-white">
    </div>

    <script>
        const configPerpus = { databaseURL: "https://e-perpus-a652c-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const configHero = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        
        if (!firebase.apps.length) firebase.initializeApp(configPerpus);
        const appHero = firebase.initializeApp(configHero, "heroApp");
        const dbHero = appHero.database();
        const dbPerpus = firebase.database();

        // Setup Hari
        const selectHari = document.getElementById('pilihHariAdmin');
        for(let i=1; i<=30; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerHTML = 'Hari ' + i;
            selectHari.appendChild(opt);
        }
        const tglMulai = new Date("2026-02-19"); 
        const tglSekarang = new Date();
        const diff = Math.floor((tglSekarang - tglMulai) / (1000 * 60 * 60 * 24));
        selectHari.value = Math.max(1, Math.min(30, diff + 1));

        function loginAdmin() {
            if (document.getElementById('adminEmail').value === "sdn169.cintadamai@gmail.com" && 
                document.getElementById('adminPass').value === "Cintadama1") {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                jalankanMonitorPerpus();
                tarikSemuaData(); // Langsung tarik data begitu masuk
            } else { alert("Akses Ditolak!"); }
        }

        // FUNGSI UTAMA: TARIK SEMUA DATA (XP & RAMADHAN) SEKALIGUS
        function tarikSemuaData() {
            const bodyXP = document.getElementById('tabelHeroBody');
            const bodyRamadhan = document.getElementById('tabelRamadhanBody');
            const hariDipilih = document.getElementById('pilihHariAdmin').value;

            bodyXP.innerHTML = "<tr><td class='p-4 italic text-slate-400 text-center'>Memuat XP...</td></tr>";
            bodyRamadhan.innerHTML = "<tr><td colspan='4' class='p-10 text-center text-slate-400 italic loading-shimmer'>Menarik data siswa...</td></tr>";

            dbHero.ref('rekap_siswa').once('value').then(snap => {
                if(!snap.exists()) {
                    bodyRamadhan.innerHTML = "<tr><td colspan='4' class='p-10 text-center text-red-500'>Data tidak ditemukan di database!</td></tr>";
                    return;
                }

                bodyXP.innerHTML = "";
                bodyRamadhan.innerHTML = "";

                snap.forEach(child => {
                    const s = child.val();
                    const path = child.key;

                    // Render Tabel XP
                    bodyXP.innerHTML += `
                        <tr class="border-b border-slate-50">
                            <td class="p-4 font-black uppercase text-indigo-900">${s.nama}</td>
                            <td class="p-4 text-center font-black text-indigo-600">${(s.xp || 0).toLocaleString()}</td>
                            <td class="p-4 text-center"><input type="number" id="inputXP_${path}" placeholder="XP Baru" class="w-20 p-2 border rounded text-center outline-none"></td>
                            <td class="p-4 text-center flex justify-center gap-1">
                                <button onclick="simpanXPSiswa('${path}', '${s.nama}')" class="bg-indigo-600 text-white px-3 py-2 rounded font-black text-[9px]">SAVE</button>
                                <button onclick="hapusHero('${path}')" class="text-red-300">🗑️</button>
                            </td>
                        </tr>`;

                    // Render Tabel Ramadhan
                    const rData = s.ramadhan || {};
                    let done = 0;
                    for(let i=1; i<=30; i++) { if(rData['h'+i]) done++; }
                    const fotoPilihan = rData['foto_h' + hariDipilih];

                    bodyRamadhan.innerHTML += `
                        <tr class="border-b border-slate-50">
                            <td class="p-4 uppercase font-black text-emerald-900">${s.nama}</td>
                            <td class="p-4 text-center font-black text-emerald-600">${done}/30</td>
                            <td class="p-4 text-center">
                                ${fotoPilihan ? 
                                    `<button onclick="previewFoto('${fotoPilihan}')" class="bg-orange-500 text-white text-[8px] font-black px-2 py-1 rounded shadow-md">📸 LIHAT H${hariDipilih}</button>` : 
                                    `<span class="text-[8px] text-slate-300 font-bold italic">Kosong</span>`
                                }
                            </td>
                            <td class="p-4 text-center no-print">
                                <button onclick="cekDetailSatset('${s.nama}')" class="bg-emerald-700 text-white text-[8px] font-black px-3 py-1 rounded-lg">JURNAL</button>
                            </td>
                        </tr>`;
                });
            }).catch(err => {
                alert("Koneksi gagal: " + err.message);
            });
        }

        function simpanXPSiswa(path, nama) {
            const inputField = document.getElementById('inputXP_' + path);
            const nilaiBaru = parseInt(inputField.value);
            if (isNaN(nilaiBaru)) return alert("Isi angka!");
            dbHero.ref('rekap_siswa/' + path).update({ xp: nilaiBaru }).then(() => { 
                alert("XP " + nama + " Berhasil diperbarui!");
                tarikSemuaData(); 
            });
        }

        function previewFoto(src) {
            document.getElementById('imgPreview').src = src;
            document.getElementById('modalFoto').classList.remove('hidden');
        }

        function cekDetailSatset(nama) {
            const path = nama.replace(/\s+/g, '_');
            dbHero.ref('rekap_siswa/' + path + '/ramadhan').once('value', snap => {
                const d = snap.val() || {};
                let res = `REKAP JURNAL: ${nama}\n\n`;
                for(let i=1; i<=30; i++) { res += `H${i}:${d['h'+i] ? '✅' : '❌'} `; if(i%5==0) res+="\n"; }
                alert(res);
            });
        }

        function jalankanMonitorPerpus() {
            dbPerpus.ref('sistem_keamanan/otp_katalog').on('value', snap => {
                if(snap.exists()) document.getElementById('monitorOTP').innerText = snap.val().kode;
            });
        }

        function hapusHero(path) { if(confirm("Hapus data siswa ini?")) dbHero.ref('rekap_siswa/' + path).remove().then(() => tarikSemuaData()); }
        
        function prosesXPSelection() {
            const nominal = parseInt(document.getElementById('massXPValue').value);
            if (isNaN(nominal)) return alert("Isi angka!");
            dbHero.ref('rekap_siswa').once('value', snap => {
                let updates = {};
                snap.forEach(child => {
                    const cur = child.val().xp || 0;
                    updates[`rekap_siswa/${child.key}/xp`] = cur + nominal;
                });
                dbHero.ref().update(updates).then(() => { 
                    alert("Bonus " + nominal + " XP dikirim ke semua!"); 
                    document.getElementById('massXPValue').value = "";
                    tarikSemuaData();
                });
            });
        }
    </script>
</body>
</html>
