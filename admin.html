<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Admin - Kiswanto</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen p-2 font-sans text-slate-200 pb-20">

    <div id="loginOverlay" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-[3rem] shadow-2xl max-w-sm w-full text-center border-b-8 border-orange-600">
            <span class="text-5xl">👨‍✈️</span>
            <h2 class="text-xl font-black uppercase italic mt-4 text-slate-800">Admin Login</h2>
            <input type="email" id="adminEmail" placeholder="EMAIL ADMIN" class="w-full text-center text-sm font-bold p-4 bg-slate-100 rounded-2xl my-4 text-slate-800 outline-none">
            <input type="password" id="adminPass" placeholder="PASSWORD" class="w-full text-center text-xl font-black p-4 bg-slate-100 rounded-2xl mb-4 text-slate-800 outline-none">
            <button onclick="loginAdmin()" class="w-full bg-orange-600 text-white font-black py-4 rounded-2xl uppercase italic text-xs">Masuk Sistem 🔓</button>
        </div>
    </div>

    <div id="adminContent" class="max-w-4xl mx-auto hidden pb-20">
        
        <div class="bg-orange-600 p-6 rounded-[2.5rem] shadow-xl mb-6 flex justify-between items-center text-white">
            <div>
                <p class="text-[9px] font-black uppercase opacity-80 italic">OTP Katalog Perpus:</p>
                <h2 id="monitorOTP" class="text-5xl font-black tracking-[0.2em] my-2">----</h2>
            </div>
            <button onclick="location.reload()" class="bg-white/20 px-4 py-2 rounded-full text-[10px] font-black uppercase italic">Keluar</button>
        </div>

        <div class="bg-indigo-900 p-6 rounded-[2rem] shadow-2xl mb-6 border-2 border-indigo-400">
            <h2 class="text-yellow-400 font-black italic uppercase text-sm mb-4">🚀 Bonus XP Masal (Semua Siswa)</h2>
            <div class="flex gap-2">
                <input type="number" id="massXPValue" placeholder="Jumlah" class="w-24 bg-white/10 p-4 rounded-2xl text-white font-black outline-none border border-white/10">
                <button onclick="prosesXPSelection('tambah')" class="flex-1 bg-emerald-600 text-white font-black rounded-2xl text-[9px] uppercase italic">➕ Tambah Ke Semua</button>
            </div>
        </div>

        <div class="bg-indigo-600 p-4 rounded-t-[2rem]">
            <h1 class="text-sm font-black italic uppercase text-white px-2">📊 Kontrol Poin & Peringkat</h1>
        </div>
        <div class="bg-white mb-8 rounded-b-[2rem] overflow-hidden shadow-xl border-x-2 border-b-2 border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-slate-800 text-[11px]">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-[9px] font-black uppercase tracking-widest">
                            <th class="p-4 border-b">Nama Siswa</th>
                            <th class="p-4 border-b text-center">XP Saat Ini</th>
                            <th class="p-4 border-b text-center">Input Baru</th>
                            <th class="p-4 border-b text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelHeroBody"></tbody>
                </table>
            </div>
        </div>

        <div class="bg-emerald-600 p-4 rounded-t-[2rem]">
            <h1 class="text-sm font-black italic uppercase text-white px-2">🌙 Monitor Satset Ramadhan</h1>
        </div>
        <div id="tabelRamadhanContainer" class="bg-white mb-8 rounded-b-[2rem] overflow-hidden shadow-xl border-x-2 border-b-2 border-slate-200">
            <table class="w-full text-left border-collapse text-slate-800 text-[11px]">
                <thead>
                    <tr class="bg-slate-50 text-slate-400 text-[8px] font-black uppercase">
                        <th class="p-4 border-b">Nama Siswa</th>
                        <th class="p-4 border-b text-center">Progres</th>
                        <th class="p-4 border-b text-center">Bukti Hari Ini</th>
                        <th class="p-4 border-b text-center">Detail</th>
                    </tr>
                </thead>
                <tbody id="tabelRamadhanBody"></tbody>
            </table>
        </div>
    </div>

    <div id="modalFoto" class="fixed inset-0 bg-black/90 hidden z-[500] flex items-center justify-center p-4" onclick="this.classList.add('hidden')">
        <img id="imgPreview" src="" class="max-w-full max-h-[80vh] rounded-2xl shadow-2xl border-4 border-white">
        <p class="absolute bottom-10 text-white font-bold uppercase text-[10px]">Klik di mana saja untuk tutup</p>
    </div>

    <script>
        const configPerpus = { databaseURL: "https://e-perpus-a652c-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const configHero = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        
        if (!firebase.apps.length) firebase.initializeApp(configPerpus);
        const appHero = firebase.initializeApp(configHero, "heroApp");
        const dbHero = appHero.database();
        const dbPerpus = firebase.database();

        function loginAdmin() {
            if (document.getElementById('adminEmail').value === "sdn169.cintadamai@gmail.com" && 
                document.getElementById('adminPass').value === "Cintadama1") {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                jalankanMonitorPerpus();
                muatRekapHero();
                muatMonitorRamadhan();
            } else { alert("Akses Ditolak!"); }
        }

        // FUNGSI HERO TRACKER (Simpan & Muat)
        function muatRekapHero() {
            dbHero.ref('rekap_siswa').on('value', snap => {
                const body = document.getElementById('tabelHeroBody');
                body.innerHTML = "";
                snap.forEach(child => {
                    const s = child.val();
                    const path = child.key;
                    body.innerHTML += `
                        <tr class="border-b border-slate-50 hover:bg-slate-50">
                            <td class="p-4 font-black uppercase text-indigo-900">${s.nama}<br><span class="text-[8px] text-slate-400">${s.kelas}</span></td>
                            <td class="p-4 text-center font-black text-indigo-600">${(s.xp || 0).toLocaleString()}</td>
                            <td class="p-4 text-center"><input type="number" id="inputXP_${path}" placeholder="XP Baru" class="w-20 p-2 border-2 border-slate-200 rounded-lg text-center font-bold outline-none"></td>
                            <td class="p-4 text-center flex justify-center gap-2">
                                <button onclick="simpanXPSiswa('${path}', '${s.nama}')" class="bg-indigo-600 text-white px-3 py-2 rounded-lg font-black uppercase text-[9px]">Simpan</button>
                                <button onclick="hapusHero('${path}')" class="text-red-300 hover:text-red-600 text-lg">🗑️</button>
                            </td>
                        </tr>`;
                });
            });
        }

        function simpanXPSiswa(path, nama) {
            const inputField = document.getElementById('inputXP_' + path);
            const nilaiBaru = parseInt(inputField.value);
            if (isNaN(nilaiBaru)) return alert("Masukkan angka XP!");
            dbHero.ref('rekap_siswa/' + path).update({ xp: nilaiBaru, waktu: "Update Guru: " + new Date().toLocaleString('id-ID') })
            .then(() => { alert("✅ XP " + nama + " Berhasil!"); inputField.value = ""; });
        }

        // FUNGSI MONITOR RAMADHAN (DENGAN FOTO)
        function muatMonitorRamadhan() {
            // Tentukan hari ini (H-berapa)
            const tglMulai = new Date("2026-02-18"); 
            const tglSekarang = new Date();
            const hariKe = Math.floor((tglSekarang - tglMulai) / (1000 * 60 * 60 * 24)) + 1;

            dbHero.ref('rekap_siswa').on('value', snap => {
                const body = document.getElementById('tabelRamadhanBody');
                body.innerHTML = "";
                snap.forEach(child => {
                    const s = child.val();
                    const rData = s.ramadhan || {};
                    let done = 0;
                    for(let i=1; i<=30; i++) { if(rData['h'+i]) done++; }
                    const persen = Math.round((done/30)*100);
                    
                    // Cek foto hari ini
                    const fotoHariIni = rData['foto_h' + hariKe];

                    body.innerHTML += `
                        <tr class="border-b border-slate-50">
                            <td class="p-4 uppercase font-black text-emerald-900">${s.nama}</td>
                            <td class="p-4 text-center">
                                <span class="font-black text-emerald-600">${done}/30</span>
                                <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden mt-1">
                                    <div class="bg-emerald-500 h-full" style="width: ${persen}%"></div>
                                </div>
                            </td>
                            <td class="p-4 text-center">
                                ${fotoHariIni ? 
                                    `<button onclick="previewFoto('${fotoHariIni}')" class="bg-orange-500 text-white text-[8px] font-black px-2 py-1 rounded shadow-md">📸 LIHAT BUKTI H${hariKe}</button>` : 
                                    `<span class="text-[8px] text-slate-300 font-bold">BELUM UPLOAD</span>`
                                }
                            </td>
                            <td class="p-4 text-center">
                                <button onclick="cekDetailSatset('${s.nama}')" class="bg-emerald-700 text-white text-[8px] font-black px-3 py-1 rounded-lg">ISI JURNAL</button>
                            </td>
                        </tr>`;
                });
            });
        }

        function previewFoto(src) {
            document.getElementById('imgPreview').src = src;
            document.getElementById('modalFoto').classList.remove('hidden');
        }

        function cekDetailSatset(nama) {
            const path = nama.replace(/\s+/g, '_');
            dbHero.ref('rekap_siswa/' + path + '/ramadhan').once('value', snap => {
                const d = snap.val() || {};
                let res = `JURNAL RAMADHAN: ${nama}\n\n`;
                for(let i=1; i<=30; i++) { res += `H${i}:${d['h'+i] ? '✅' : '❌'} `; if(i%5==0) res+="\n"; }
                alert(res);
            });
        }

        // FUNGSI UTILITY LAINNYA
        function prosesXPSelection(tipe) {
            const nominal = parseInt(document.getElementById('massXPValue').value);
            if (isNaN(nominal)) return alert("Isi angka!");
            dbHero.ref('rekap_siswa').once('value', snap => {
                let updates = {};
                snap.forEach(child => {
                    const cur = child.val().xp || 0;
                    updates[`rekap_siswa/${child.key}/xp`] = cur + nominal;
                });
                dbHero.ref().update(updates).then(() => { alert("✅ Bonus Masal Berhasil!"); document.getElementById('massXPValue').value = ""; });
            });
        }

        function jalankanMonitorPerpus() {
            dbPerpus.ref('sistem_keamanan/otp_katalog').on('value', snap => {
                if(snap.exists()) document.getElementById('monitorOTP').innerText = snap.val().kode;
            });
        }

        function hapusHero(path) { if(confirm("Hapus data siswa ini?")) dbHero.ref('rekap_siswa/' + path).remove(); }
    </script>
</body>
</html>
