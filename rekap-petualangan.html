<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Tracker - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-indigo-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden border-b-[12px] border-yellow-400">
        
        <div class="bg-indigo-700 p-6 text-center text-white cursor-pointer" onclick="cekModeGuru()">
            <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">Petualangan Hero</h1>
            <div id="statusHero" class="mt-2 bg-indigo-800 rounded-full py-1 px-4 inline-block border border-indigo-500 text-[10px] font-bold uppercase text-emerald-400 tracking-widest">SINKRONISASI...</div>
        </div>

        <div id="progressPanel" class="hidden px-6 pt-4">
            <div class="flex justify-between text-[10px] font-black text-indigo-900 mb-1 uppercase">
                <span>Poin Saya</span>
                <span id="valPoin">0 / 2000 XP</span>
            </div>
            <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden border-2 border-white shadow-sm">
                <div id="barPoin" class="bg-yellow-400 h-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <div id="formNama" class="hidden p-8 space-y-4">
            <input type="text" id="inputNama" placeholder="NAMA LENGKAP..." class="w-full bg-slate-100 p-5 rounded-2xl text-center font-black text-indigo-700 border-2 border-transparent focus:border-yellow-400 outline-none uppercase shadow-inner">
            <select id="inputKelas" class="w-full bg-slate-100 p-5 rounded-2xl font-black text-indigo-700 border-2 border-transparent focus:border-yellow-400 outline-none uppercase text-center appearance-none">
                <option value="">-- PILIH KELAS --</option>
                <option value="Kelas 1">Kelas 1</option><option value="Kelas 2">Kelas 2</option>
                <option value="Kelas 3">Kelas 3</option><option value="Kelas 4">Kelas 4</option>
                <option value="Kelas 5">Kelas 5</option><option value="Kelas 6">Kelas 6</option>
            </select>
            <button onclick="simpanProfil()" class="w-full bg-yellow-400 text-indigo-900 font-black p-5 rounded-2xl shadow-[0_6px_0_0_#ca8a04] active:shadow-none active:translate-y-1 transition-all uppercase italic">Mulai Aksi 🚀</button>
        </div>

        <div id="panelGuru" class="hidden bg-red-50 p-6 border-y-2 border-red-200">
            <p class="text-[10px] font-black text-red-600 mb-2 uppercase text-center">🔐 MODE GURU: EDIT POIN</p>
            <div class="flex gap-2">
                <input type="number" id="newXP" class="flex-1 p-3 rounded-xl border-2 border-red-300 font-black text-center" placeholder="XP BARU">
                <button onclick="updateXPManual()" class="bg-red-600 text-white px-4 rounded-xl font-black text-xs">SIMPAN</button>
            </div>
        </div>

        <div id="formMisi" class="hidden p-6 space-y-3">
            <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4" data-limit="05:30" data-poin="50">
                <div class="flex items-center justify-between">
                    <div class="flex items-center"><input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600"><p class="font-black text-slate-700 text-xs uppercase">🌞 BANGUN & IBADAH</p></div>
                    <p class="text-[8px] font-bold text-red-500 italic uppercase">05:30</p>
                </div>
            </div>
            <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4" data-limit="06:30" data-poin="40">
                <div class="flex items-center justify-between">
                    <div class="flex items-center"><input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600"><p class="font-black text-slate-700 text-xs uppercase">🧹 BANTU ORANG TUA</p></div>
                    <p class="text-[8px] font-bold text-red-500 italic uppercase">06:30</p>
                </div>
            </div>
            <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4" data-limit="07:00" data-poin="30">
                <div class="flex items-center justify-between">
                    <div class="flex items-center"><input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600"><p class="font-black text-slate-700 text-xs uppercase">🎒 SIAP SEKOLAH</p></div>
                    <p class="text-[8px] font-bold text-red-500 italic uppercase">07:00</p>
                </div>
            </div>
            <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4" data-limit="20:00" data-poin="40">
                <div class="flex items-center justify-between">
                    <div class="flex items-center"><input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600"><p class="font-black text-slate-700 text-xs uppercase">📖 BELAJAR MALAM</p></div>
                    <p class="text-[8px] font-bold text-red-500 italic uppercase">20:00</p>
                </div>
            </div>
            <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4" data-limit="21:30" data-poin="50">
                <div class="flex items-center justify-between">
                    <div class="flex items-center"><input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600"><p class="font-black text-slate-700 text-xs uppercase">💤 TIDUR CEPAT</p></div>
                    <p class="text-[8px] font-bold text-red-500 italic uppercase">21:30</p>
                </div>
            </div>

            <button onclick="logout()" class="w-full mt-6 text-[9px] font-black text-slate-300 uppercase tracking-tighter">Logout / Ganti Identitas</button>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let clickHeader = 0;
        let hNama = localStorage.getItem('heroNama');
        let hKelas = localStorage.getItem('heroKelas');

        window.onload = () => {
            if (hNama && hKelas) sinkronData();
            else { document.getElementById('formNama').classList.remove('hidden'); }
        };

        function sinkronData() {
            const path = hNama.replace(/\s+/g, '_');
            db.ref('rekap_siswa/' + path).on('value', snap => {
                let xpVal = 0;
                if(snap.exists()) xpVal = parseInt(snap.val().xp) || 0;
                updateTampilan(xpVal);
            });
        }

        function simpanProfil() {
            const n = document.getElementById('inputNama').value.trim().toUpperCase();
            const k = document.getElementById('inputKelas').value;
            if (n.length < 3 || !k) return alert("Lengkapi Nama & Kelas!");
            localStorage.setItem('heroNama', n); localStorage.setItem('heroKelas', k);
            hNama = n; hKelas = k;
            sinkronData();
        }

        function updateTampilan(xp) {
            document.getElementById('formNama').classList.add('hidden');
            document.getElementById('formMisi').classList.remove('hidden');
            document.getElementById('progressPanel').classList.remove('hidden');
            document.getElementById('statusHero').innerText = `${hNama} (${hKelas})`;
            window.currentXP = xp;
            document.getElementById('valPoin').innerText = xp + " XP";
            let p = (xp / 2000) * 100;
            document.getElementById('barPoin').style.width = Math.min(p, 100) + "%";
        }

        function kirimOtomatis(el) {
            if(!el.checked) return;
            const box = el.closest('.misi-item');
            const [h, m] = box.dataset.limit.split(':').map(Number);
            const now = new Date(); const limit = new Date(); limit.setHours(h, m, 0);
            let pDapat = (now <= limit) ? parseInt(box.dataset.poin) : -parseInt(box.dataset.poin);
            if(now > limit) alert("Terlambat! Poin berkurang.");
            else { confetti({ particleCount: 50 }); el.disabled = true; }
            simpanKeFirebase((window.currentXP || 0) + pDapat);
        }

        function simpanKeFirebase(xpBaru) {
            if(xpBaru < 0) xpBaru = 0;
            const path = hNama.replace(/\s+/g, '_');
            db.ref('rekap_siswa/' + path).update({ nama: hNama, kelas: hKelas, xp: xpBaru, waktu: new Date().toLocaleString() });
        }

        // FITUR GURU
        function cekModeGuru() {
            clickHeader++;
            if(clickHeader >= 5) {
                document.getElementById('panelGuru').classList.toggle('hidden');
                clickHeader = 0;
            }
        }

        function updateXPManual() {
            const val = document.getElementById('newXP').value;
            if(val === "") return alert("Isi angka!");
            simpanKeFirebase(parseInt(val));
            alert("XP berhasil diperbarui!");
            document.getElementById('panelGuru').classList.add('hidden');
        }

        function logout() { if(confirm("Ganti Akun?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
