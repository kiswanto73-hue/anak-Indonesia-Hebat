<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Tracker - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-indigo-900 min-h-screen pb-20 font-sans text-slate-800">

    <nav class="sticky top-0 z-50 bg-indigo-800/90 backdrop-blur-md border-b border-indigo-500 px-4 py-3 mb-6">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <span class="text-white font-black italic text-sm tracking-tighter uppercase">⚡ INDONESIA HEBAT</span>
            </a>
            <a href="menu-perpus.html" class="text-[10px] font-black uppercase bg-yellow-400 px-3 py-2 rounded-xl text-indigo-900 shadow-lg shadow-yellow-500/20">Menu Utama</a>
        </div>
    </nav>

    <div class="max-w-md mx-auto px-4">
        <div class="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border-b-[12px] border-yellow-400 mb-6">
            <div class="bg-indigo-700 p-6 text-center text-white">
                <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">Petualangan Hero</h1>
                <div id="statusHero" class="mt-2 bg-indigo-800 rounded-full py-1 px-4 inline-block border border-indigo-500 text-[10px] font-bold uppercase">🟢 HERO AKTIF</div>
            </div>

            <div id="progressPanel" class="hidden px-6 pt-4">
                <div class="flex justify-between text-[10px] font-black text-indigo-900 mb-1 uppercase">
                    <span>Target Piagam</span>
                    <span id="valPoin">0 / 2000 XP</span>
                </div>
                <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden border-2 border-white shadow-sm">
                    <div id="barPoin" class="bg-yellow-400 h-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <div id="formNama" class="p-8 space-y-4">
                <input type="text" id="inputNama" placeholder="NAMA LENGKAP..." class="w-full bg-slate-100 p-5 rounded-2xl text-center font-black text-indigo-700 border-2 border-transparent focus:border-yellow-400 outline-none uppercase">
                <select id="inputKelas" class="w-full bg-slate-100 p-5 rounded-2xl font-black text-indigo-700 border-2 border-transparent focus:border-yellow-400 outline-none uppercase text-center appearance-none">
                    <option value="">-- PILIH KELAS --</option>
                    <option value="Kelas 1">KELAS 1</option><option value="Kelas 2">KELAS 2</option>
                    <option value="Kelas 3">KELAS 3</option><option value="Kelas 4">KELAS 4</option>
                    <option value="Kelas 5">KELAS 5</option><option value="Kelas 6">KELAS 6</option>
                </select>
                <button onclick="simpanProfil()" class="w-full bg-yellow-400 text-indigo-900 font-black p-5 rounded-2xl shadow-[0_6px_0_0_#ca8a04] active:shadow-none active:translate-y-1 transition-all uppercase italic">Mulai Aksi 🚀</button>
            </div>

            <div id="formMisi" class="hidden p-6 space-y-3">
                <div class="misi-item bg-slate-50 border-2 border-slate-100 rounded-2xl p-4" data-limit="05:30" data-poin="50" data-label="BANGUN & IBADAH">
                    <div class="flex items-center">
                        <input type="checkbox" onchange="kirimOtomatis(this)" class="w-6 h-6 mr-3 accent-indigo-600">
                        <div>
                            <p class="font-black text-slate-700 text-xs">🌞 BANGUN & IBADAH</p>
                            <p class="text-[9px] font-bold text-red-500 italic">BATAS: 05.30</p>
                        </div>
                    </div>
                </div>
                <button id="btnPiagam" onclick="cetakPiagam()" class="hidden w-full bg-indigo-600 text-white font-black p-4 rounded-2xl mt-4 border-4 border-yellow-400 italic animate-bounce">📜 CETAK PIAGAM HERO</button>
            </div>
        </div>

        <div class="bg-indigo-800/50 rounded-[2rem] p-6 border border-white/10">
            <h2 class="text-yellow-400 font-black italic text-center mb-4 uppercase text-sm italic">Peringkat Pahlawan 🏆</h2>
            
            <div class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2">
                <button onclick="muatLeaderboard('SEMUA')" class="filter-btn bg-yellow-400 text-indigo-900 px-4 py-2 rounded-xl text-[10px] font-black uppercase">Semua</button>
                <button onclick="muatLeaderboard('Kelas 1')" class="filter-btn bg-indigo-700 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Kls 1</button>
                <button onclick="muatLeaderboard('Kelas 2')" class="filter-btn bg-indigo-700 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Kls 2</button>
                <button onclick="muatLeaderboard('Kelas 3')" class="filter-btn bg-indigo-700 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Kls 3</button>
                <button onclick="muatLeaderboard('Kelas 4')" class="filter-btn bg-indigo-700 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Kls 4</button>
                <button onclick="muatLeaderboard('Kelas 5')" class="filter-btn bg-indigo-700 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Kls 5</button>
                <button onclick="muatLeaderboard('Kelas 6')" class="filter-btn bg-indigo-700 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Kls 6</button>
            </div>

            <div id="tabelPeringkat" class="space-y-3">
                </div>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.database();

        let heroNama = localStorage.getItem('heroNama') || "";
        let heroKelas = localStorage.getItem('heroKelas') || "";
        let tabunganPoin = parseInt(localStorage.getItem('heroXP')) || 0;

        window.onload = () => { 
            if(heroNama && heroKelas) tampilkanMisi();
            muatLeaderboard('SEMUA');
        };

        function simpanProfil() {
            const n = document.getElementById('inputNama').value.trim().toUpperCase();
            const k = document.getElementById('inputKelas').value;
            if(n.length < 3 || !k) return alert("Isi Nama & Pilih Kelas!");
            heroNama = n; heroKelas = k;
            localStorage.setItem('heroNama', n); localStorage.setItem('heroKelas', k);
            tampilkanMisi();
        }

        function tampilkanMisi() {
            document.getElementById('formNama').classList.add('hidden');
            document.getElementById('formMisi').classList.remove('hidden');
            document.getElementById('progressPanel').classList.remove('hidden');
            document.getElementById('statusHero').innerText = heroNama + " (" + heroKelas + ")";
            updateUIProgress();
        }

        function updateUIProgress() {
            document.getElementById('valPoin').innerText = `${tabunganPoin} / 2000 XP`;
            let p = (tabunganPoin / 2000) * 100;
            document.getElementById('barPoin').style.width = Math.min(p, 100) + "%";
            if(tabunganPoin >= 2000) document.getElementById('btnPiagam').classList.remove('hidden');
        }

        function kirimOtomatis(el) {
            const box = el.closest('.misi-item');
            const limitStr = box.dataset.limit;
            const label = box.dataset.label;
            const now = new Date();
            const menitSekarang = (now.getHours() * 60) + now.getMinutes();
            const [h, m] = limitStr.split(':').map(Number);
            const menitLimit = (h * 60) + m;

            if (el.checked) {
                let pDapat = (menitSekarang <= menitLimit) ? parseInt(box.dataset.poin) : -parseInt(box.dataset.poin);
                if (menitSekarang > menitLimit) alert("Terlambat! Poin dikurangi.");
                else { confetti({ particleCount: 50 }); el.disabled = true; }

                tabunganPoin += pDapat; if(tabunganPoin < 0) tabunganPoin = 0;
                localStorage.setItem('heroXP', tabunganPoin);
                updateUIProgress();

                // SINKRON KE LEADERBOARD
                db.ref('hero_leaderboard/' + heroNama.replace(/\s+/g, '_')).update({
                    nama: heroNama, kelas: heroKelas, total_xp: tabunganPoin, update: now.toLocaleString()
                });
            }
        }

        function muatLeaderboard(filter) {
            // Update UI Tombol
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.replace('bg-yellow-400', 'bg-indigo-700');
                btn.classList.replace('text-indigo-900', 'text-white');
            });
            event?.target.classList.replace('bg-indigo-700', 'bg-yellow-400');
            event?.target.classList.replace('text-white', 'text-indigo-900');

            db.ref('hero_leaderboard').orderByChild('total_xp').limitToLast(10).on('value', snap => {
                const container = document.getElementById('tabelPeringkat');
                container.innerHTML = "";
                let heroes = [];
                snap.forEach(s => { 
                    const data = s.val();
                    if(filter === 'SEMUA' || data.kelas === filter) heroes.push(data);
                });
                
                heroes.reverse().forEach((h, i) => {
                    container.innerHTML += `
                        <div class="flex items-center justify-between bg-white/10 p-4 rounded-2xl border border-white/5">
                            <div class="flex items-center gap-3">
                                <span class="text-yellow-400 font-black">#${i+1}</span>
                                <div>
                                    <p class="text-[11px] font-black text-white uppercase leading-none">${h.nama}</p>
                                    <p class="text-[8px] text-yellow-400/70 font-bold uppercase mt-1">${h.kelas}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-xs font-black text-emerald-400">${h.total_xp} XP</p>
                            </div>
                        </div>`;
                });
            });
        }

        function cetakPiagam() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF('landscape');
            doc.setFillColor(30, 27, 75); doc.rect(0, 0, 297, 210, 'F');
            doc.setDrawColor(250, 204, 21); doc.setLineWidth(10); doc.rect(10, 10, 277, 190);
            doc.setTextColor(250, 204, 21); doc.setFontSize(40); doc.text("PIAGAM HERO INDONESIA", 148, 70, {align: "center"});
            doc.setTextColor(255, 255, 255); doc.setFontSize(30); doc.text(heroNama, 148, 110, {align: "center"});
            doc.setFontSize(15); doc.text("Siswa Hebat dari " + heroKelas, 148, 130, {align: "center"});
            doc.save(`Piagam_Hero_${heroNama}.pdf`);
        }
    </script>
</body>
</html>
