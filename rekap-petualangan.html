<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Tracker - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden border-b-[12px] border-indigo-600">
        
        <div class="bg-indigo-700 p-6 text-center text-white cursor-pointer" onclick="cekModeGuru()">
            <p id="gelarHero" class="text-[10px] font-black tracking-[0.3em] text-yellow-400 mb-1 uppercase italic">Memuat Gelar...</p>
            <h1 id="displayNama" class="text-2xl font-black italic tracking-tighter uppercase leading-none">Petualangan Hero</h1>
            <div id="lvlBadge" class="mt-2 bg-white/20 rounded-full py-1 px-4 inline-block border border-white/30 text-[10px] font-bold uppercase">Leveling...</div>
        </div>

        <div id="progressPanel" class="hidden px-6 pt-4 text-center">
            <div class="flex justify-between text-[10px] font-black text-indigo-900 mb-1 uppercase">
                <span>Poin Level Ini</span>
                <span id="valPoin">0 / 2000 XP</span>
            </div>
            <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden p-[2px]">
                <div id="barPoin" class="bg-indigo-600 h-full rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <div id="panelGuru" class="hidden bg-red-50 p-6 border-y-2 border-red-200 space-y-3">
            <p class="text-[10px] font-black text-red-600 uppercase text-center tracking-widest">🔐 ADMIN KISWANTO</p>
            
            <div class="flex gap-2">
                <input type="number" id="newXP" class="flex-1 p-3 rounded-xl border-2 border-red-300 font-black text-center text-sm" placeholder="SET XP BARU">
                <button onclick="updateXPManual()" class="bg-red-600 text-white px-4 rounded-xl font-black text-[10px] uppercase">Simpan</button>
            </div>

            <div class="pt-2 border-t border-red-200">
                <p class="text-[9px] font-bold text-slate-500 mb-1 uppercase">Filter Pantauan Kelas:</p>
                <select onchange="filterDataKelas(this.value)" class="w-full p-2 rounded-lg border border-red-200 text-xs font-bold uppercase outline-none">
                    <option value="">Semua Kelas</option>
                    <option value="Kelas 1">Kelas 1</option>
                    <option value="Kelas 2">Kelas 2</option>
                    <option value="Kelas 3">Kelas 3</option>
                    <option value="Kelas 4">Kelas 4</option>
                    <option value="Kelas 5">Kelas 5</option>
                    <option value="Kelas 6">Kelas 6</option>
                </select>
            </div>
        </div>

        <div id="formNama" class="hidden p-8 space-y-4">
            <div class="text-center mb-2">
                <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">Identitas Pahlawan</p>
            </div>
            <input type="text" id="inputNama" placeholder="NAMA LENGKAP..." class="w-full bg-slate-100 p-5 rounded-2xl text-center font-black text-indigo-700 border-2 border-transparent focus:border-indigo-500 outline-none uppercase shadow-inner">
            
            <select id="inputKelas" class="w-full bg-slate-100 p-5 rounded-2xl font-black text-indigo-700 border-2 border-transparent focus:border-indigo-500 outline-none uppercase text-center appearance-none cursor-pointer">
                <option value="">-- PILIH KELAS --</option>
                <option value="Kelas 1">KELAS 1</option>
                <option value="Kelas 2">KELAS 2</option>
                <option value="Kelas 3">KELAS 3</option>
                <option value="Kelas 4">KELAS 4</option>
                <option value="Kelas 5">KELAS 5</option>
                <option value="Kelas 6">KELAS 6</option>
            </select>

            <button onclick="simpanProfil()" class="w-full bg-indigo-600 text-white font-black p-5 rounded-2xl shadow-xl uppercase italic tracking-tighter hover:bg-indigo-700 transition-all">Mulai Petualangan 🚀</button>
        </div>

        <div id="formMisi" class="hidden p-6 space-y-3">
            <div id="listMisi" class="space-y-3"></div>

            <div id="boxSertifikat" class="hidden mt-6 p-5 bg-yellow-400 rounded-[2rem] text-center shadow-xl animate-bounce border-4 border-white">
                <p class="font-black text-indigo-900 text-[10px] uppercase mb-1">Target Tercapai! 🏆</p>
                <button onclick="cetakSertifikat()" class="w-full bg-indigo-700 text-white font-black py-4 rounded-2xl uppercase italic text-[11px] shadow-lg">📜 Ambil Sertifikat Level</button>
            </div>

            <button onclick="logout()" class="w-full mt-6 text-[9px] font-black text-slate-300 hover:text-red-400 uppercase tracking-tighter transition-colors italic underline">Ganti Identitas Hero</button>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.database();

        const daftarMisi = [
            { label: "🌞 Bangun & Ibadah", limit: "05:30", poin: 50 },
            { label: "🧹 Bantu Orang Tua", limit: "06:30", poin: 40 },
            { label: "🎒 Siap Sekolah", limit: "07:00", poin: 30 },
            { label: "📖 Belajar Malam", limit: "20:00", poin: 40 },
            { label: "💤 Tidur Cepat", limit: "21:30", poin: 50 }
        ];

        let hNama = localStorage.getItem('heroNama');
        let hKelas = localStorage.getItem('heroKelas');
        let clickHeader = 0;

        window.onload = () => {
            renderMisi();
            if (hNama && hKelas) sinkronData();
            else document.getElementById('formNama').classList.remove('hidden');
        };

        function renderMisi() {
            document.getElementById('listMisi').innerHTML = daftarMisi.map(m => `
                <div class="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex justify-between items-center hover:border-indigo-200 transition-all">
                    <div class="flex items-center">
                        <input type="checkbox" onchange="prosesMisi(this, ${m.poin}, '${m.limit}')" class="w-7 h-7 mr-3 accent-indigo-600 cursor-pointer">
                        <div>
                            <p class="font-black text-slate-700 text-[11px] uppercase">${m.label}</p>
                            <p class="text-[8px] font-bold text-red-500 opacity-70 uppercase italic">Batas: ${m.limit}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function sinkronData() {
            const path = hNama.replace(/\s+/g, '_');
            db.ref('rekap_siswa/' + path).on('value', snap => {
                let xpVal = 0;
                if(snap.exists()) xpVal = parseInt(snap.val().xp) || 0;
                updateTampilan(xpVal);
            });
        }

        function updateTampilan(xp) {
            document.getElementById('formNama').classList.add('hidden');
            document.getElementById('formMisi').classList.remove('hidden');
            document.getElementById('progressPanel').classList.remove('hidden');
            
            window.currentXP = xp;
            const level = Math.floor(xp / 2000) + 1;
            const xpSisa = xp % 2000;
            const gelarArr = ["Calon Pahlawan", "Pahlawan Muda", "Pahlawan Sejati", "Pahlawan Agung", "Legenda Hebat"];
            
            document.getElementById('displayNama').innerText = hNama;
            document.getElementById('gelarHero').innerText = gelarArr[Math.min(level-1, 4)] + " (" + hKelas + ")";
            document.getElementById('lvlBadge').innerText = "Level " + level;
            document.getElementById('valPoin').innerText = xpSisa + " / 2000 XP";
            document.getElementById('barPoin').style.width = (xpSisa / 2000 * 100) + "%";

            if (xp >= 2000) document.getElementById('boxSertifikat').classList.remove('hidden');
            else document.getElementById('boxSertifikat').classList.add('hidden');
        }

        function prosesMisi(el, poin, limitStr) {
            if(!el.checked) return;
            const [h, m] = limitStr.split(':').map(Number);
            const now = new Date(); const limit = new Date(); limit.setHours(h, m, 0);
            
            let pDapat = (now <= limit) ? poin : -poin;
            if(now > limit) alert("Waduh, kamu terlambat! Poin dikurangi.");
            else { confetti({particleCount: 50, spread: 60}); el.disabled = true; }
            
            let baru = (window.currentXP || 0) + pDapat;
            if(baru < 0) baru = 0;
            const path = hNama.replace(/\s+/g, '_');
            db.ref('rekap_siswa/' + path).update({ 
                nama: hNama, 
                kelas: hKelas, 
                xp: baru, 
                waktu: now.toLocaleString('id-ID') 
            });
        }

        function filterDataKelas(kls) {
            // Logika filter kelas untuk admin jika diperlukan pengembangan dashboard
            console.log("Memantau kelas:", kls);
            alert("Mode Pantau: Menampilkan data " + (kls || "Semua Kelas"));
        }

        function cetakSertifikat() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            const xp = window.currentXP;
            const lvl = Math.floor(xp / 2000);
            
            const figur = [
                { g: "CALON PAHLAWAN", i: "🛡️", c: [192, 192, 192] },
                { g: "PAHLAWAN MUDA", i: "🏹", c: [255, 215, 0] },
                { g: "PAHLAWAN SEJATI", i: "⚔️", c: [0, 191, 255] },
                { g: "PAHLAWAN AGUNG", i: "👑", c: [255, 69, 0] },
                { g: "LEGENDA HEBAT", i: "🐲", c: [147, 112, 219] }
            ];
            const d = figur[Math.min(lvl-1, 4)];

            doc.setFillColor(20, 20, 40); doc.rect(0, 0, 297, 210, 'F');
            doc.setDrawColor(d.c[0], d.c[1], d.c[2]); doc.setLineWidth(5); doc.rect(10, 10, 277, 190);
            doc.setFontSize(100); doc.text(d.i, 240, 110, {align: "center"});
            doc.setTextColor(d.c[0], d.c[1], d.c[2]); doc.setFontSize(40); doc.setFont("helvetica", "bold");
            doc.text(d.g, 130, 55, {align: "center"});
            doc.setTextColor(255, 255, 255); doc.setFontSize(35); doc.text(hNama, 130, 95, {align: "center"});
            doc.setFontSize(16); doc.text(`Berhasil Menguasai Karakter Level ${lvl} (${hKelas})`, 130, 115, {align: "center"});
            doc.setFontSize(14); doc.text("INDONESIA, " + new Date().toLocaleDateString('id-ID'), 220, 155, {align: "center"});
            doc.setFontSize(18); doc.text("KISWANTO", 220, 185, {align: "center"});
            doc.save(`Sertifikat_Lvl${lvl}_${hNama}.pdf`);
        }

        function simpanProfil() {
            const n = document.getElementById('inputNama').value.trim().toUpperCase();
            const k = document.getElementById('inputKelas').value;
            if(n.length < 3 || !k) return alert("Pilih Nama & Kelas Pahlawan!");
            localStorage.setItem('heroNama', n); 
            localStorage.setItem('heroKelas', k);
            hNama = n; hKelas = k; sinkronData();
        }

        function cekModeGuru() { clickHeader++; if(clickHeader >= 5) { document.getElementById('panelGuru').classList.toggle('hidden'); clickHeader = 0; } }
        function updateXPManual() { 
            const v = document.getElementById('newXP').value; 
            if(v!=="") { db.ref('rekap_siswa/' + hNama.replace(/\s+/g, '_')).update({ xp: parseInt(v) }); alert("XP Berhasil Diperbarui!"); }
        }
        function logout() { if(confirm("Ganti Akun? Data progres tetap tersimpan di server.")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
