<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Tracker - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
        .misi-card { transition: all 0.3s ease; }
        .misi-card:active { transform: scale(0.97); }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-2 md:p-4 font-sans text-slate-800">

    <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden border-b-[12px] border-indigo-600 relative">
        
        <div class="bg-indigo-700 p-6 text-center text-white cursor-pointer select-none" onclick="cekModeGuru()">
            <p id="gelarHero" class="text-[10px] font-black tracking-[0.3em] text-yellow-400 mb-1 uppercase italic">Memuat Hero...</p>
            <h1 id="displayNama" class="text-2xl font-black italic tracking-tighter uppercase leading-none">Petualangan Hero</h1>
            <div id="lvlBadge" class="mt-2 bg-white/20 rounded-full py-1 px-4 inline-block border border-white/30 text-[10px] font-bold uppercase">Leveling...</div>
        </div>

        <div id="progressPanel" class="hidden px-6 pt-4 text-center">
            <div class="flex justify-between text-[10px] font-black text-indigo-900 mb-1 uppercase">
                <span>XP Explorer</span>
                <span id="valPoin">0 / 2000 XP</span>
            </div>
            <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden p-[2px]">
                <div id="barPoin" class="bg-indigo-600 h-full rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <div id="tabNav" class="hidden space-y-3 px-6 mt-6">
            <button onclick="bukaLeaderboard()" class="w-full py-3 bg-yellow-400 text-indigo-900 rounded-2xl font-black text-[10px] uppercase shadow-lg border-b-4 border-yellow-600 active:border-b-0 transition-all">
                🏆 Lihat Peringkat Hero Dunia
            </button>
            <div class="flex gap-2">
                <button id="btnHero" onclick="pindahMenu('hero')" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-indigo-600 text-white shadow-md">🛡️ Hero Tracker</button>
                <button id="btnSatset" onclick="pindahMenu('satset')" class="flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-slate-100 text-slate-400">🌙 Satset Ramadhan</button>
            </div>
        </div>

        <div id="formNama" class="hidden p-8 space-y-4">
            <input type="text" id="inputNama" placeholder="NAMA LENGKAP..." class="w-full bg-slate-100 p-5 rounded-2xl text-center font-black text-indigo-700 border-2 border-transparent focus:border-indigo-500 outline-none uppercase shadow-inner">
            <select id="inputKelas" class="w-full bg-slate-100 p-5 rounded-2xl font-black text-indigo-700 text-center uppercase appearance-none cursor-pointer">
                <option value="">-- PILIH KELAS --</option>
                <option>Kelas 1</option><option>Kelas 2</option><option>Kelas 3</option>
                <option>Kelas 4</option><option>Kelas 5</option><option>Kelas 6</option>
            </select>
            <button onclick="simpanProfil()" class="w-full bg-indigo-600 text-white font-black p-5 rounded-2xl shadow-xl uppercase italic">Mulai Petualangan 🚀</button>
        </div>

        <div id="formMisi" class="hidden p-6 pt-2">
            
            <div id="divHero" class="space-y-3">
                <div id="listMisi" class="space-y-3"></div>
                <div id="boxSertifikat" class="hidden mt-6 p-5 bg-gradient-to-r from-yellow-400 to-amber-500 rounded-[2rem] text-center shadow-xl border-4 border-white animate-bounce">
                    <button onclick="generatePiagam()" class="w-full bg-indigo-700 text-white font-black py-4 rounded-2xl uppercase italic text-[11px] shadow-lg">📜 Unduh Piagam Hero & Trophy</button>
                </div>
            </div>

            <div id="divSatset" class="hidden space-y-3">
                <div class="bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-100 mb-2 text-center">
                    <p class="text-[10px] font-black text-emerald-700 uppercase italic leading-none">🌙 SATSET RAMADHAN</p>
                    <p class="text-[7px] font-bold text-emerald-600 uppercase tracking-widest mt-1">Gembok otomatis terbuka jam 00:00</p>
                </div>
                <div id="listSatset" class="space-y-3 max-h-[380px] overflow-y-auto pr-2 custom-scroll"></div>
            </div>

            <div id="panelGuru" class="hidden mt-8 p-6 bg-slate-900 rounded-[2.5rem] border-2 border-red-500 space-y-4">
                <p class="text-[10px] font-black text-red-500 uppercase text-center tracking-widest">🔐 Monitoring Admin</p>
                <div class="flex gap-2">
                    <input type="number" id="newXP" class="flex-1 p-3 rounded-xl bg-slate-800 text-white font-black text-center text-sm" placeholder="XP BARU">
                    <button onclick="updateXPManual()" class="bg-red-600 text-white px-4 rounded-xl font-black text-[10px] uppercase">SET</button>
                </div>
            </div>

            <button onclick="logout()" class="w-full mt-10 text-[9px] font-black text-slate-300 uppercase italic underline text-center block">Ganti Identitas Hero</button>
        </div>

        <div id="modalLeaderboard" class="fixed inset-0 z-[500] bg-indigo-950/95 hidden overflow-y-auto p-6 backdrop-blur-md">
            <div class="max-w-sm mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-white font-black italic uppercase text-xl text-yellow-400">🏆 Top 10 Hero</h2>
                    <button onclick="tutupLeaderboard()" class="text-white text-4xl">&times;</button>
                </div>
                <div id="isiLeaderboard" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.database();

        const daftarMisi = [
            { label: "🌞 Bangun & Ibadah Subuh", limit: "05:30", poin: 50 },
            { label: "🧹 Bantu Orang Tua", limit: "06:30", poin: 40 },
            { label: "🎒 Siap Sekolah Mandiri", limit: "07:00", poin: 30 },
            { label: "📖 Belajar / Mengaji", limit: "20:30", poin: 40 },
            { label: "💤 Tidur Maks 21:30", limit: "21:30", poin: 50 }
        ];

        const dataSatset = [
            { h: 1, m: "Menyiapkan sajadah Ortu" }, { h: 2, m: "Menghafal doa buka puasa" }, { h: 3, m: "Taruh piring kotor ke dapur" },
            { h: 4, m: "Merapikan tempat tidur" }, { h: 5, m: "Memijat bahu Mama/Papa" }, { h: 6, m: "Memberi senyum & salam" },
            { h: 7, m: "Sabar dan tidak marah" }, { h: 8, m: "Subuh tepat waktu" }, { h: 9, m: "Baca 5 ayat Al-Quran" },
            { h: 10, m: "Sedekah uang jajan" }, { h: 11, m: "Ikut Sholat Tarawih" }, { h: 12, m: "Hafal 1 surat pendek" },
            { h: 13, m: "Doakan Bapak Ibu Guru" }, { h: 14, m: "Mendengar cerita Nabi" }, { h: 15, m: "Berbagi takjil" },
            { h: 16, m: "Buang sampah orang lain" }, { h: 17, m: "Sopan bertemu tetangga" }, { h: 18, m: "Meminjamkan mainan" },
            { h: 19, m: "Hemat air dan listrik" }, { h: 20, m: "Surat cinta buat Ortu" }, { h: 21, m: "Berkata jujur seharian" },
            { h: 22, m: "Siapkan baju ibadah" }, { h: 23, m: "Menyiram tanaman" }, { h: 24, m: "Baca buku 15 menit" },
            { h: 25, m: "Membantu masak buka" }, { h: 26, m: "Menyusun alas kaki" }, { h: 27, m: "Mengajak teman sholat" },
            { h: 28, m: "Belajar 1 Asmaul Husna" }, { h: 29, m: "Bersihkan debu meja" }, { h: 30, m: "Meminta maaf ke Ortu" }
        ];

        let hNama = localStorage.getItem('heroNama');
        let hKelas = localStorage.getItem('heroKelas');
        let clickHeader = 0;

        window.onload = () => {
            if (hNama && hKelas) { sinkronData(); } 
            else { document.getElementById('formNama').classList.remove('hidden'); }
        };

        function sinkronData() {
            const path = hNama.replace(/\s+/g, '_');
            db.ref('rekap_siswa/' + path).on('value', snap => {
                const data = snap.val();
                if (data) {
                    updateTampilan(parseInt(data.xp) || 0);
                    renderMisiHero(data.misi_harian || {});
                } else {
                    db.ref('rekap_siswa/' + path).set({ nama: hNama, kelas: hKelas, xp: 0, waktu: new Date().toLocaleString() });
                }
            });
        }

        function updateTampilan(xp) {
            document.getElementById('formNama').classList.add('hidden');
            document.getElementById('formMisi').classList.remove('hidden');
            document.getElementById('progressPanel').classList.remove('hidden');
            document.getElementById('tabNav').classList.remove('hidden');
            window.currentXP = xp;
            const level = Math.floor(xp / 2000) + 1;
            const xpSisa = xp % 2000;
            const gelarArr = ["Calon Pahlawan", "Pahlawan Muda", "Pahlawan Sejati", "Pahlawan Agung", "Legenda Hebat"];
            document.getElementById('displayNama').innerText = hNama;
            document.getElementById('gelarHero').innerText = gelarArr[Math.min(level-1, 4)] + " (" + hKelas + ")";
            document.getElementById('lvlBadge').innerText = "Level " + level;
            document.getElementById('valPoin').innerText = xpSisa + " / 2000 XP";
            document.getElementById('barPoin').style.width = (xpSisa / 2000 * 100) + "%";
            if (xp >= 2000) document.getElementById('boxSertifikat').classList.remove('hidden');
        }

        function renderMisiHero(dataTercentang) {
            const tglHariIni = new Date().toLocaleDateString('id-ID');
            document.getElementById('listMisi').innerHTML = daftarMisi.map((m, idx) => {
                const isDone = dataTercentang['misi_' + idx] === tglHariIni;
                return `
                    <div class="misi-card bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 flex justify-between items-center shadow-sm">
                        <div><p class="font-black text-slate-700 text-[11px] uppercase italic">${m.label}</p>
                        <p class="text-[8px] font-bold text-red-500 italic mt-1 uppercase">Batas: ${m.limit}</p></div>
                        <input type="checkbox" ${isDone ? 'checked disabled' : ''} onchange="prosesMisi(this, ${m.poin}, '${m.limit}', ${idx})" class="w-8 h-8 accent-indigo-600 cursor-pointer">
                    </div>`;
            }).join('');
        }

        function prosesMisi(el, poin, limitStr, idxMisi) {
            if(!el.checked) return;
            const path = hNama.replace(/\s+/g, '_');
            const now = new Date(); const [h, m] = limitStr.split(':').map(Number);
            const limit = new Date(); limit.setHours(h, m, 0, 0);
            let pDapat = (now <= limit) ? poin : -poin;
            if(now > limit) alert("Terlambat! Poin dikurangi.");
            else confetti({particleCount: 40});
            let baru = Math.max(0, (window.currentXP || 0) + pDapat);
            db.ref('rekap_siswa/' + path).update({ xp: baru, ['misi_harian/misi_' + idxMisi]: now.toLocaleDateString('id-ID') });
        }

        // --- FIX LOGIKA GEMBOK JALUR PAKSA ---
        function muatSatset() {
            const path = hNama.replace(/\s+/g, '_');
            const sekarang = new Date();
            const tglS = sekarang.getDate();
            const blnS = sekarang.getMonth(); // Feb = 1
            const thnS = sekarang.getFullYear();
            const tglM = 18; const blnM = 1; const thnM = 2026;

            let hariKe = 0;
            if (thnS >= thnM && blnS >= blnM) {
                hariKe = (tglS - tglM) + 1;
            }

            db.ref('rekap_siswa/' + path + '/ramadhan').once('value', snap => {
                const data = snap.val() || {};
                document.getElementById('listSatset').innerHTML = dataSatset.map(item => {
                    const isDone = data['h' + item.h] ? true : false;
                    const isToday = item.h === hariKe;
                    const isLocked = item.h > hariKe || hariKe <= 0;
                    return `
                        <div class="p-4 rounded-3xl border-2 transition-all ${isToday ? 'bg-emerald-50 border-emerald-400 shadow-md' : 'bg-white border-slate-50'} ${isLocked ? 'opacity-50' : ''}">
                            <div class="flex justify-between items-center">
                                <span class="text-[9px] font-black ${isToday ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-400'} w-8 h-8 flex items-center justify-center rounded-full">H${item.h}</span>
                                <p class="flex-1 ml-3 text-[10px] font-black text-slate-700 uppercase">${item.m}</p>
                                ${isDone ? '✅' : (isLocked ? '🔒' : (isToday ? '⭐' : '🔓'))}
                            </div>
                            ${isToday && !isDone ? `
                                <div class="mt-3">
                                    <label class="block w-full py-3 bg-white border-2 border-dashed border-emerald-300 rounded-xl text-center text-[9px] font-bold text-emerald-600 cursor-pointer hover:bg-emerald-100 transition-all">
                                        📸 UNGGAH BUKTI HARI INI
                                        <input type="file" accept="image/*" class="hidden" onchange="prosesSatset(${item.h}, this)">
                                    </label>
                                </div>` : ''}
                        </div>`;
                }).join('');
            });
        }

        function prosesSatset(hari, el) {
            const file = el.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const path = hNama.replace(/\s+/g, '_');
                db.ref('rekap_siswa/' + path + '/ramadhan').update({ 
                    ['h' + hari]: true, ['foto_h' + hari]: e.target.result, tgl: new Date().toLocaleString() 
                }).then(() => {
                    db.ref('rekap_siswa/' + path).update({ xp: (window.currentXP || 0) + 100 });
                    confetti({particleCount: 150});
                    muatSatset();
                });
            };
        }

        // --- PIAGAM DENGAN TROPHY SESUAI LEVEL ---
        function generatePiagam() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });
            const level = Math.floor(window.currentXP / 2000) + 1;

            let warnaPiala = "#cd7f32"; // Bronze
            let labelPiala = "🏆 BRONZE HERO";
            if (level >= 3 && level < 5) { warnaPiala = "#c0c0c0"; labelPiala = "🏆 SILVER HERO"; }
            else if (level >= 5) { warnaPiala = "#ffd700"; labelPiala = "🏆 GOLDEN HERO"; }

            doc.setFillColor(30, 27, 75); doc.rect(0, 0, 297, 210, 'F');
            doc.setDrawColor(warnaPiala); doc.setLineWidth(2);
            doc.setFillColor(255, 255, 255); doc.roundedRect(10, 10, 277, 190, 5, 5, 'FD');

            doc.setTextColor(30, 27, 75); doc.setFont("helvetica", "bold"); doc.setFontSize(35);
            doc.text("PIAGAM PENGHARGAAN", 148, 50, { align: "center" });

            doc.setDrawColor(warnaPiala); doc.line(80, 55, 215, 55);

            doc.setFontSize(18); doc.setFont("helvetica", "normal");
            doc.text("Diberikan kepada Hero terbaik kami:", 148, 75, { align: "center" });

            doc.setFontSize(45); doc.setTextColor(63, 81, 181);
            doc.text(hNama, 148, 105, { align: "center" });

            doc.setFontSize(20); doc.setTextColor(30, 27, 75);
            doc.text(`ATAS KEBERHASILAN MENCAPAI LEVEL ${level}`, 148, 130, { align: "center" });
            
            doc.setFillColor(warnaPiala); doc.circle(148, 165, 15, 'F'); 
            doc.setTextColor(255, 255, 255); doc.setFontSize(10); doc.text("LVL", 148, 163, { align: "center" });
            doc.setFontSize(16); doc.text(`${level}`, 148, 172, { align: "center" });
            
            doc.setTextColor(warnaPiala); doc.setFontSize(12); doc.setFont("helvetica", "bold");
            doc.text(labelPiala, 148, 188, { align: "center" });

            doc.setTextColor(150, 150, 150); doc.setFontSize(10);
            doc.text(`Dicetak: ${new Date().toLocaleDateString('id-ID')}`, 280, 195, { align: "right" });

            doc.save(`Piagam_Hero_${hNama}.pdf`);
        }

        function pindahMenu(menu) {
            document.getElementById('divHero').classList.toggle('hidden', menu !== 'hero');
            document.getElementById('divSatset').classList.toggle('hidden', menu === 'hero');
            document.getElementById('btnHero').className = menu === 'hero' ? 'flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-indigo-600 text-white shadow-md' : 'flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-slate-100 text-slate-400';
            document.getElementById('btnSatset').className = menu === 'satset' ? 'flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-indigo-600 text-white shadow-md' : 'flex-1 py-3 rounded-2xl font-black text-[10px] uppercase transition-all bg-slate-100 text-slate-400';
            if(menu === 'satset') muatSatset();
        }

        function bukaLeaderboard() {
            document.getElementById('modalLeaderboard').classList.remove('hidden');
            const list = document.getElementById('isiLeaderboard');
            list.innerHTML = `<p class="text-white text-center italic animate-pulse py-10">Mencari Hero Terbaik...</p>`;
            db.ref('rekap_siswa').orderByChild('xp').limitToLast(10).once('value', snap => {
                let d = []; snap.forEach(c => { d.push(c.val()); });
                d.reverse();
                list.innerHTML = d.map((s, i) => `
                    <div class="flex items-center justify-between bg-white/10 p-4 rounded-2xl border border-white/5">
                        <div class="flex items-center gap-4">
                            <span class="text-xl font-black ${i==0?'text-yellow-400':i==1?'text-slate-300':'text-indigo-400'}">#${i+1}</span>
                            <div><p class="text-white font-black text-xs uppercase">${s.nama}</p>
                            <p class="text-[8px] text-white/50 font-bold uppercase">${s.kelas}</p></div>
                        </div>
                        <p class="text-yellow-400 font-black text-sm">${(s.xp || 0).toLocaleString()}</p>
                    </div>`).join('');
            });
        }

        function tutupLeaderboard() { document.getElementById('modalLeaderboard').classList.add('hidden'); }
        function simpanProfil() {
            const n = document.getElementById('inputNama').value.trim().toUpperCase();
            const k = document.getElementById('inputKelas').value;
            if(n.length < 3 || !k) return alert("Lengkapi data!");
            localStorage.setItem('heroNama', n); localStorage.setItem('heroKelas', k);
            location.reload();
        }
        function cekModeGuru() { clickHeader++; if(clickHeader >= 5) { document.getElementById('panelGuru').classList.toggle('hidden'); clickHeader = 0; } }
        function logout() { if(confirm("Ganti Akun?")) { localStorage.clear(); location.reload(); } }
        function updateXPManual() { 
            const v = document.getElementById('newXP').value; 
            if(v!=="") { db.ref('rekap_siswa/' + hNama.replace(/\s+/g, '_')).update({ xp: parseInt(v) }); alert("XP Berhasil Diubah!"); }
        }
    </script>
</body>
</html>
