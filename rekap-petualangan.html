<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Tracker - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-indigo-900 min-h-screen pb-10">

    <nav class="p-4 bg-indigo-800 text-white flex justify-between items-center sticky top-0 z-50 shadow-xl">
        <a href="index.html" class="font-black italic">🏠 HOME</a>
        <div id="displayNama" class="text-[10px] font-bold uppercase text-yellow-400"></div>
    </nav>

    <div class="max-w-md mx-auto p-4">
        <div id="boxLogin" class="bg-white p-6 rounded-[2rem] shadow-2xl mb-6">
            <h2 class="text-center font-black text-indigo-900 mb-4 uppercase">Masuk Sebagai Hero</h2>
            <input type="text" id="nama" placeholder="NAMA LENGKAP" class="w-full p-4 mb-3 bg-slate-100 rounded-xl font-bold uppercase outline-none border-2 focus:border-yellow-400">
            <select id="kelas" class="w-full p-4 mb-4 bg-slate-100 rounded-xl font-bold outline-none">
                <option value="">PILIH KELAS</option>
                <option value="Kelas 1">Kelas 1</option><option value="Kelas 2">Kelas 2</option>
                <option value="Kelas 3">Kelas 3</option><option value="Kelas 4">Kelas 4</option>
                <option value="Kelas 5">Kelas 5</option><option value="Kelas 6">Kelas 6</option>
            </select>
            <button onclick="masukHero()" class="w-full bg-yellow-400 text-indigo-900 font-black p-4 rounded-xl uppercase shadow-lg">Mulai Beraksi 🚀</button>
        </div>

        <div id="boxMisi" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl flex justify-between items-center border-b-4 border-yellow-400">
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase">Poin Kamu</p>
                    <p id="tampilXP" class="text-2xl font-black text-indigo-900">0 XP</p>
                </div>
                <button onclick="logout()" class="text-[10px] bg-red-100 text-red-600 px-3 py-1 rounded-lg font-bold">GANTI AKUN</button>
            </div>

            <div class="grid grid-cols-1 gap-3">
                <div class="bg-white p-5 rounded-2xl shadow-md border-l-8 border-emerald-500">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-black text-slate-800 text-sm uppercase">🌞 Bangun & Ibadah</p>
                            <p class="text-[9px] text-slate-400 font-bold">Batas: 05:30 WIB</p>
                        </div>
                        <input type="checkbox" onchange="prosesMisi(this, 'MISI_1', 50, '05:30')" class="w-8 h-8 accent-emerald-500">
                    </div>
                </div>
                </div>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let currentHero = JSON.parse(localStorage.getItem('heroData'));

        window.onload = () => { if(currentHero) tampilkanHalamanMisi(); };

        function masukHero() {
            const n = document.getElementById('nama').value.trim().toUpperCase();
            const k = document.getElementById('kelas').value;
            if(!n || !k) return alert("Isi Nama & Kelas!");
            
            // Ambil data dari database dulu agar poin tidak reset ke 0
            db.ref('hero_leaderboard/' + n.replace(/\s+/g, '_')).once('value', snap => {
                let xp = 0;
                if(snap.exists()) xp = snap.val().total_xp;
                
                currentHero = { nama: n, kelas: k, xp: xp };
                localStorage.setItem('heroData', JSON.stringify(currentHero));
                tampilkanHalamanMisi();
            });
        }

        function tampilkanHalamanMisi() {
            document.getElementById('boxLogin').classList.add('hidden');
            document.getElementById('boxMisi').classList.remove('hidden');
            document.getElementById('displayNama').innerText = `${currentHero.nama} (${currentHero.kelas})`;
            
            // Sync poin terbaru dari database
            db.ref('hero_leaderboard/' + currentHero.nama.replace(/\s+/g, '_')).on('value', snap => {
                if(snap.exists()) {
                    currentHero.xp = snap.val().total_xp;
                    document.getElementById('tampilXP').innerText = currentHero.xp + " XP";
                }
            });
        }

        function prosesMisi(el, idMisi, poin, limit) {
            if(!el.checked) return;
            
            const now = new Date();
            const [h, m] = limit.split(':').map(Number);
            const limitTime = new Date(); limitTime.setHours(h, m, 0);

            let pAkhir = (now <= limitTime) ? poin : -poin;
            if(now > limitTime) alert("Terlambat! Poin berkurang.");
            
            currentHero.xp += pAkhir;
            if(currentHero.xp < 0) currentHero.xp = 0;

            // Simpan ke database (Path Tunggal agar data tidak terpencar)
            const path = currentHero.nama.replace(/\s+/g, '_');
            db.ref('hero_leaderboard/' + path).update({
                nama: currentHero.nama,
                kelas: currentHero.kelas,
                total_xp: currentHero.xp,
                update_terakhir: now.toLocaleString()
            });

            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            el.disabled = true;
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
