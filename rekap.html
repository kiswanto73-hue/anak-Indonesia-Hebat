<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Guru - Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-indigo-700 text-white p-5 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="font-black text-xl uppercase italic">Monitoring Siswa</h1>
            <div class="text-[10px] bg-red-500 px-3 py-1 rounded-full animate-pulse">LIVE DATA</div>
        </div>
    </nav>

    <div class="container mx-auto p-4 lg:p-8">
        <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] text-gray-400 uppercase bg-slate-50">
                            <th class="p-6">Nama Siswa</th>
                            <th class="p-6 text-center">Poin</th>
                            <th class="p-6">Aktivitas Terakhir</th>
                            <th class="p-6 text-right">Jam Update</th>
                        </tr>
                    </thead>
                    <tbody id="rekapTableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA0_GBPJRz3yQQiEb9a5PkGLgrfBBHPloA",
            authDomain: "ceklist-anak-indonesia-hebat.firebaseapp.com",
            databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.firebaseio.com",
            projectId: "ceklist-anak-indonesia-hebat",
            storageBucket: "ceklist-anak-indonesia-hebat.firebasestorage.app",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        database.ref('rekap_siswa').on('value', (snapshot) => {
            const data = snapshot.val();
            const tableBody = document.getElementById('rekapTableBody');
            tableBody.innerHTML = '';

            if (data) {
                const listSiswa = Object.keys(data).map(key => data[key]);
                listSiswa.sort((a, b) => b.total_poin - a.total_poin);
                listSiswa.forEach(siswa => {
                    tableBody.innerHTML += `
                        <tr class="hover:bg-indigo-50 transition">
                            <td class="p-6 font-bold text-slate-700">${siswa.nama}</td>
                            <td class="p-6 text-center"><span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-black italic">${siswa.total_poin}</span></td>
                            <td class="p-6 text-xs text-slate-500">${siswa.misi_terakhir}</td>
                            <td class="p-6 text-right text-[10px] text-gray-400 font-mono">${siswa.waktu_update}</td>
                        </tr>`;
                });
            } else {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-gray-400 italic">Belum ada siswa yang masuk...</td></tr>`;
            }
        });
    </script>
</body>
</html>
