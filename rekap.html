<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - Hero Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto">
        <div class="bg-indigo-900 p-8 rounded-[2.5rem] shadow-2xl border-b-8 border-yellow-400 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-black text-white italic">MONITORING HERO 🛡️</h1>
                <p class="text-yellow-400 font-bold text-xs uppercase tracking-widest">Sistem Kedisiplinan Anak Indonesia</p>
            </div>
            <div class="flex gap-3">
                <button onclick="downloadExcel()" class="bg-green-500 hover:bg-green-600 text-white font-black px-6 py-3 rounded-2xl shadow-lg transition-all text-xs">📊 EXCEL</button>
                <button onclick="resetData()" class="bg-red-500 hover:bg-red-600 text-white font-black px-6 py-3 rounded-2xl shadow-lg transition-all text-xs">🗑️ RESET</button>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border-2 border-slate-100">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-100 text-indigo-900 uppercase text-[10px] font-black tracking-widest border-b">
                        <tr>
                            <th class="p-6">Nama Hero</th>
                            <th class="p-6">Aktivitas Terakhir</th>
                            <th class="p-6 text-center">Poin</th>
                            <th class="p-6 text-center">Total XP</th>
                            <th class="p-6">Waktu Lapor</th>
                        </tr>
                    </thead>
                    <tbody id="tabelRekap" class="divide-y divide-slate-100 italic">
                        <tr><td colspan="5" class="p-20 text-center text-slate-300 font-bold">Menunggu data Hero...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let dataGlobal = [];

        db.ref('rekap_siswa').on('value', (snapshot) => {
            const tbody = document.getElementById('tabelRekap');
            tbody.innerHTML = "";
            dataGlobal = [];

            if (snapshot.exists()) {
                snapshot.forEach((child) => {
                    const d = child.val();
                    dataGlobal.push({
                        "Nama Hero": d.nama,
                        "Misi": d.misi,
                        "Poin": d.poin_harian,
                        "Total": d.total_xp,
                        "Waktu": d.waktu
                    });

                    const badgeColor = d.poin_harian < 0 ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600';

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-all">
                            <td class="p-6 font-black text-indigo-700 uppercase italic text-sm">${d.nama}</td>
                            <td class="p-6 text-[10px] font-bold text-slate-500">${d.misi || "-"}</td>
                            <td class="p-6 text-center">
                                <span class="${badgeColor} px-3 py-1 rounded-full font-black text-[10px]">
                                    ${d.poin_harian > 0 ? '+' : ''}${d.poin_harian}
                                </span>
                            </td>
                            <td class="p-6 text-center">
                                <div class="flex flex-col items-center">
                                    <p class="text-[10px] font-black text-indigo-900 mb-1">${d.total_xp} / 2000</p>
                                    <div class="w-24 bg-slate-100 h-2 rounded-full overflow-hidden border">
                                        <div style="width:${(d.total_xp/2000)*100}%" class="bg-yellow-400 h-full"></div>
                                    </div>
                                </div>
                            </td>
                            <td class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${d.waktu}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="p-20 text-center text-slate-300 font-black">BELUM ADA DATA</td></tr>';
            }
        });

        function downloadExcel() {
            if (dataGlobal.length === 0) return alert("Belum ada data!");
            const ws = XLSX.utils.json_to_sheet(dataGlobal);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "RekapHero");
            XLSX.writeFile(wb, `REKAP_HERO_${new Date().toLocaleDateString()}.xlsx`);
        }

        function resetData() {
            if (confirm("Hapus semua data?")) {
                const k = prompt("Ketik 'HAPUS':");
                if (k === "HAPUS") db.ref('rekap_siswa').remove();
            }
        }
    </script>
</body>
</html>
