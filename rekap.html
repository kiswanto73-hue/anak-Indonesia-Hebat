<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Laporan Siswa</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="bg-indigo-700 p-6 text-center text-white">
            <h1 class="text-2xl font-black italic">PANTAUAN SISWA HEBAT</h1>
            <p class="text-xs opacity-75 uppercase tracking-widest font-bold">Data Masuk Real-Time</p>
        </div>

        <div class="p-4 overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-indigo-700 uppercase text-xs">
                        <th class="p-4 border-b-2">Nama Siswa</th>
                        <th class="p-4 border-b-2">Aktivitas Terakhir</th>
                        <th class="p-4 border-b-2 text-center">Waktu Update</th>
                    </tr>
                </thead>
                <tbody id="tabelRekap" class="text-slate-700 font-medium">
                    <tr>
                        <td colspan="3" class="p-8 text-center text-slate-400 italic animate-pulse">Menunggu data masuk dari server...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // PASTIKAN ALAMAT INI SAMA DENGAN HALAMAN SISWA (SERVER ASIA)
        const firebaseConfig = {
            databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Mengambil data secara Real-Time
        db.ref('rekap_siswa').on('value', (snapshot) => {
            const tableBody = document.getElementById('tabelRekap');
            tableBody.innerHTML = ""; // Bersihkan tampilan lama

            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const row = `
                        <tr class="border-b hover:bg-indigo-50 transition-all animate__animated animate__fadeIn">
                            <td class="p-4 font-black text-indigo-600 uppercase text-sm">${data.nama}</td>
                            <td class="p-4 text-xs">${data.aktivitas}</td>
                            <td class="p-4 text-center text-[10px] font-bold text-slate-400">${data.waktu}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } else {
                tableBody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-slate-400">Belum ada data masuk hari ini.</td></tr>';
            }
        });
    </script>
</body>
</html>
