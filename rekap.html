<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Guru - Indonesia Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="bg-indigo-700 p-8 text-white flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-2xl font-black italic uppercase">Dashboard Guru</h1>
                <p class="text-xs opacity-75 font-bold tracking-widest">Monitoring Karakter Real-Time</p>
            </div>
            <button onclick="downloadExcel()" class="bg-green-500 hover:bg-green-600 text-white font-black px-6 py-3 rounded-2xl shadow-lg transition-all flex items-center gap-2 text-sm">
                📊 UNDUH LAPORAN (EXCEL)
            </button>
        </div>

        <div class="p-6 overflow-x-auto">
            <table id="tabelData" class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-indigo-700 uppercase text-xs font-black">
                        <th class="p-4 border-b-2">Nama Siswa</th>
                        <th class="p-4 border-b-2">Aktivitas Terakhir</th>
                        <th class="p-4 border-b-2 text-center">Waktu</th>
                    </tr>
                </thead>
                <tbody id="tabelRekap" class="text-slate-700 font-medium">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let dataUntukExcel = [];

        db.ref('rekap_siswa').on('value', (snapshot) => {
            const tableBody = document.getElementById('tabelRekap');
            tableBody.innerHTML = "";
            dataUntukExcel = []; // Reset data excel

            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    dataUntukExcel.push({
                        "Nama Siswa": data.nama,
                        "Aktivitas": data.aktivitas,
                        "Waktu Update": data.waktu
                    });

                    const row = `
                        <tr class="border-b hover:bg-indigo-50 transition-all">
                            <td class="p-4 font-black text-indigo-600 uppercase text-sm">${data.nama}</td>
                            <td class="p-4 text-xs font-semibold text-slate-500">${data.aktivitas}</td>
                            <td class="p-4 text-center text-[10px] font-bold text-slate-400">${data.waktu}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } else {
                tableBody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-slate-400">Belum ada data.</td></tr>';
            }
        });

        function downloadExcel() {
            if (dataUntukExcel.length === 0) return alert("Belum ada data untuk diunduh!");
            
            const worksheet = XLSX.utils.json_to_sheet(dataUntukExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan");
            
            // Nama file berdasarkan tanggal
            const tanggal = new Date().toLocaleDateString('id-ID').replace(/\//g, '-');
            XLSX.writeFile(workbook, `Laporan_Siswa_Hebat_${tanggal}.xlsx`);
        }
    </script>
</body>
</html>
