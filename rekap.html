<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - Pantauan Hebat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-indigo-900 italic">LOG AKTIVITAS SISWA</h1>
                <p class="text-sm font-bold text-slate-400">Total Hero Terpantau: <span id="countSiswa">0</span></p>
            </div>
            <div class="flex gap-2">
                <button onclick="downloadExcel()" class="bg-indigo-600 text-white font-bold px-6 py-3 rounded-xl shadow-lg hover:bg-indigo-700 transition-all">📊 EXCEL</button>
                <button onclick="resetData()" class="bg-red-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg hover:bg-red-600 transition-all">🗑️ RESET DATA</button>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border-2 border-slate-100">
            <table class="w-full text-left">
                <thead class="bg-slate-100 text-indigo-900 uppercase text-xs font-black">
                    <tr>
                        <th class="p-6">Nama Hero</th>
                        <th class="p-6">Misi Selesai</th>
                        <th class="p-6 text-center">XP Didapat</th>
                        <th class="p-6">Waktu</th>
                    </tr>
                </thead>
                <tbody id="tabelRekap" class="divide-y divide-slate-100">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://ceklist-anak-indonesia-hebat-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config);
        const db = firebase.database();

        db.ref('rekap_siswa').on('value', (snapshot) => {
            const table = document.getElementById('tabelRekap');
            const count = document.getElementById('countSiswa');
            table.innerHTML = "";
            let i = 0;

            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    const d = child.val();
                    i++;
                    table.innerHTML += `
                        <tr class="hover:bg-indigo-50 transition-all">
                            <td class="p-6 font-black text-indigo-600 uppercase italic text-sm">${d.nama}</td>
                            <td class="p-6 text-xs font-bold text-slate-500">${d.misi}</td>
                            <td class="p-6 text-center"><span class="bg-yellow-400 text-indigo-900 px-3 py-1 rounded-full font-black text-xs">${d.poin} XP</span></td>
                            <td class="p-6 text-[10px] font-bold text-slate-400">${d.waktu}</td>
                        </tr>
                    `;
                });
                count.innerText = i;
            } else {
                table.innerHTML = '<tr><td colspan="4" class="p-20 text-center font-bold text-slate-300">BELUM ADA MISI YANG SELESAI</td></tr>';
                count.innerText = "0";
            }
        });

        function resetData() {
            if(confirm("PERINGATAN! Semua data laporan siswa akan dihapus permanen. Sudah di-download ke Excel?")) {
                const pass = prompt("Masukkan Kode Keamanan (Ketik 'HAPUS'):");
                if(pass === "HAPUS") {
                    db.ref('rekap_siswa').remove();
                    alert("Data berhasil dibersihkan!");
                } else {
                    alert("Kode salah!");
                }
            }
        }

        // Fungsi Download Excel (Sama seperti sebelumnya)
        function downloadExcel() {
            // ... (logika download sama)
        }
    </script>
</body>
</html>
